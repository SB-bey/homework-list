<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>作业清单 · 10月3日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #121418 0%, #0d0f12 100%);
    min-height: 100vh;
    padding: 24px 16px 40px;
    color: #e6e9ef;
  }
  .card {
    max-width: 520px;
    margin: 0 auto;
    background: #1b1f26;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    border: 1px solid #262c36;
    padding: 24px 20px 20px;
  }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .date { font-size: 13px; color: #8b96a6; }
  .sub { font-size: 13px; color: #8b96a6; margin-bottom: 16px; }
  .progress-wrap { background: #2a303c; border-radius: 10px; height: 10px; margin-bottom: 18px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4caf7d, #6fd09a); border-radius: 10px; transition: width .3s ease; }
  .progress-text { font-size: 12px; color: #8b96a6; margin-top: 6px; text-align: right; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 10px;
    border-bottom: 1px solid #262c36;
    font-size: 16px;
    animation: fadeIn .25s ease;
  }
  li:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .check {
    width: 22px; height: 22px; flex-shrink: 0;
    border: 2px solid #465264; border-radius: 7px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s ease; position: relative;
  }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s ease; }
  li.done .check { background: #4caf7d; border-color: #4caf7d; }
  li.done .check svg { opacity: 1; }
  .text { flex: 1; cursor: pointer; line-height: 1.5; transition: color .15s ease; word-break: break-word; }
  li.done .text { text-decoration: line-through; text-decoration-thickness: 2px; color: #5a6474; }
  .del {
    flex-shrink: 0; width: 26px; height: 26px; border: none; background: none;
    color: #5f6a7c; font-size: 18px; line-height: 1; cursor: pointer; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; transition: all .15s ease;
  }
  .del:hover { color: #ff6b7a; background: #33222a; }
  .skip-btn {
    border: 1.5px solid #3a4454; background: #1b1f26; color: #9aa5b4;
    border-radius: 9px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    flex-shrink: 0; transition: all .15s ease;
  }
  .skip-btn:hover { color: #ffd479; border-color: #ffd479; background: #2a2418; }
  li.skipped .text { opacity: .45; font-style: italic; text-decoration: line-through; text-decoration-style: dotted; text-decoration-color: #555f6e; }
  li.skipped .check { border-color: #3a4454; opacity: .5; }
  .add-row { display: flex; gap: 10px; margin-top: 18px; }
  .add-row input {
    flex: 1; border: 2px solid #333b49; border-radius: 12px; padding: 12px 14px;
    font-size: 15px; outline: none; background: #12151b; color: #e6e9ef; transition: border-color .2s ease;
  }
  .add-row input:focus { border-color: #4caf7d; }
  .add-row input::placeholder { color: #6b7686; }
  .add-row button {
    border: none; border-radius: 12px; padding: 0 20px; font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, #4caf7d, #6fd09a); color: #fff; cursor: pointer;
    transition: opacity .2s ease;
  }
  .add-row button:active { opacity: .8; }
  .add-row select {
    border: 2px solid #333b49; border-radius: 12px; padding: 0 8px;
    font-size: 14px; background: #12151b; color: #e6e9ef; outline: none; flex-shrink: 0;
    height: 44px; max-width: 96px;
  }
  .group-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    margin: 18px 0 4px; padding-top: 10px;
    border-top: 1px dashed #2a303c;
  }
  .group-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .group-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .suggest-card {
    border: 2px solid #333b49; border-radius: 14px;
    background: #161a21; padding: 14px 14px 12px; margin-bottom: 16px;
  }
  .suggest-head { font-size: 13px; font-weight: 700; color: #6fd09a; margin-bottom: 8px; }
  .suggest-body {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    min-height: 30px; padding: 8px 10px; background: #1b1f26;
    border: 1px dashed #3a4454; border-radius: 10px; font-size: 15px; margin-bottom: 10px;
  }
  .suggest-empty { color: #7d8898; font-size: 14px; }
  .do-btn {
    margin-left: auto; border: none; border-radius: 9px; padding: 5px 14px;
    font-size: 13px; font-weight: 600; background: #4caf7d; color: #fff; cursor: pointer;
    flex-shrink: 0; transition: opacity .2s ease;
  }
  .do-btn:active { opacity: .75; }
  .suggest-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .mode-label { font-size: 12px; color: #7d8898; }
  .mode-btn {
    border: 1.5px solid #3a4454; background: #1b1f26; color: #9aa5b4;
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; transition: all .15s ease;
  }
  .mode-btn.active { background: #4caf7d; border-color: #4caf7d; color: #fff; font-weight: 600; }
  .pick-row select {
    border: 1.5px solid #3a4454; background: #1b1f26; color: #dbe2ec;
    border-radius: 8px; padding: 3px 8px; font-size: 12.5px; outline: none;
  }
  .hint { font-size: 12px; color: #6b7686; margin-top: 14px; text-align: center; }
  .tag {
    display: inline-block; font-size: 12px; color: #fff; border-radius: 6px;
    padding: 1px 8px; margin-right: 8px; vertical-align: 1px; flex-shrink: 0;
  }
  .photo-card {
    border: 2px solid #333b49; border-radius: 14px;
    background: #161a21; padding: 12px; margin-bottom: 16px;
  }
  .photo-head { font-size: 13px; font-weight: 700; color: #6fd09a; margin-bottom: 8px; }
  .photo-card a { display: block; }
  .photo-card img { width: 100%; border-radius: 10px; display: block; cursor: zoom-in; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📋 作业清单</h1>
    <span class="date">10月3日 周六 · 国庆假期</span>
  </div>
  <div class="sub">点一下条目即可划掉，完成进度自动保存</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="progress-text" id="ptext"></div>
  <div class="suggest-card">
    <div class="suggest-head" id="suggestHead">🎯 下一个建议写</div>
    <div class="suggest-body" id="suggestBody"></div>
    <div class="suggest-controls">
      <span class="mode-label">模式</span>
      <button class="mode-btn active" id="modeGroup">同科优先</button>
      <button class="mode-btn" id="modeRandom">随机</button>
      <span class="mode-label" style="margin-left:4px">指定科目</span>
      <select id="pickSubject"><option value="">自动</option></select>
    </div>
  </div>
  <div class="photo-card" id="photoCard" style="display:none">
    <div class="photo-head">📷 作业原图 · 看不清点开看大图</div>
    <a id="photoLink" href="#" target="_blank" rel="noopener">
      <img id="photoImg" src="" alt="作业原图">
    </a>
  </div>
  <ul id="list"></ul>
  <div class="add-row">
    <select id="newSubject" aria-label="选择科目">
      <option value="">科目</option>
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="历史">历史</option>
      <option value="政治">政治</option>
      <option value="化学">化学</option>
      <option value="物理">物理</option>
    </select>
    <input id="newItem" type="text" placeholder="输入作业内容" maxlength="60">
    <button id="addBtn">添加</button>
  </div>
  <div class="hint">推荐不喜欢？点「跳过它」换一个推荐；列表里点条目/方块划掉完成</div>
</div>
<script>
(function(){
  var KEY = 'hw-archive-2026-10-03';
  var PHOTO = 'photos/2026-10-03.jpg';   // 当天作业原图，没有照片就留空 ''
  var COLORS = { '历史': '#9a7bd6', '化学': '#4aa3a3', '语文': '#c2579a', '英语': '#3fa86b', '政治': '#d0566e', '数学': '#4a7bd6', '物理': '#e08a3c' };
  var items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { items = null; }
  if (!items) {
    items = [
      { text: '试卷×2', subject: '化学', done: false },
      { text: '《基》写到12页', subject: '语文', done: false },
      { text: '简爱有感600字', subject: '语文', done: false },
      { text: '13、14课+课外古诗', subject: '语文', done: false },
      { text: '试卷×1', subject: '数学', done: false },
      { text: '《基》12-16', subject: '数学', done: false },
      { text: '试卷×1（作文档）', subject: '英语', done: false },
      { text: '4、5两段', subject: '英语', done: false },
      { text: '听写 Unit1 Unit2 单词前13个', subject: '英语', done: false },
      { text: '背诵 试卷', subject: '英语', done: false },
      { text: '《基》33-34', subject: '政治', done: false },
      { text: '自主默写', subject: '政治', done: false },
      { text: '试卷×3', subject: '政治', done: false },
      { text: '《基》1、2、11课', subject: '历史', done: false },
      { text: '试卷×2', subject: '历史', done: false },
      { text: '《基》25-26', subject: '物理', done: false },
      { text: '试卷', subject: '物理', done: false }
    ];
    save();
  }

  var list = document.getElementById('list');
  var input = document.getElementById('newItem');
  var bar = document.getElementById('bar');
  var ptext = document.getElementById('ptext');
  var suggestBody = document.getElementById('suggestBody');
  var suggestHead = document.getElementById('suggestHead');
  var pickSubject = document.getElementById('pickSubject');
  var mode = 'group';   // 'group' 同科优先 | 'random' 随机
  var pick = '';        // '' 自动 | 科目名
  var lastSubject = localStorage.getItem(KEY + '-last') || '';  // 记住正在写的科目

  function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

  function pickableSubjects(){
    var subs = [];
    items.forEach(function(it){
      if(!it.done && !it.skipped && it.subject && subs.indexOf(it.subject) === -1) subs.push(it.subject);
    });
    return subs;
  }

  function suggest(){
    var undone = items.filter(function(it){ return !it.done && !it.skipped; });
    if(!undone.length){
      var sk = items.filter(function(it){ return it.skipped; }).length;
      suggestBody.innerHTML = sk
        ? '<span class="suggest-empty">🎉 待做的写完啦，还有 ' + sk + ' 项跳过的可以「恢复」</span>'
        : '<span class="suggest-empty">🎉 全部写完啦，可以休息了！</span>';
      suggestHead.textContent = '🎯 下一个建议写';
      return;
    }
    var target = null, reason = '';
    if(pick){
      var pu = undone.filter(function(it){ return it.subject === pick; });
      if(pu.length){ target = pu[0]; reason = '指定科目「' + pick + '」'; }
      else {
        suggestBody.innerHTML = '<span class="suggest-empty">「' + pick + '」已经写完啦 ✅</span>';
        suggestHead.textContent = '🎯 下一个建议写';
        return;
      }
    } else if(mode === 'group'){
      // 先接着写正在写的科目（同科集中写完），写完再换剩余最多的科目
      var lastUndone = null;
      if(lastSubject){
        var lu = undone.filter(function(it){ return it.subject === lastSubject; });
        if(lu.length) lastUndone = lu[0];
      }
      if(lastUndone){
        target = lastUndone;
        reason = '接着写「' + lastSubject + '」，还剩 ' + lu.length + ' 项';
      } else {
        var counts = {};
        undone.forEach(function(it){ if(it.subject) counts[it.subject] = (counts[it.subject]||0) + 1; });
        var keys = Object.keys(counts);
        if(keys.length){
          keys.sort(function(a,b){ return counts[b] - counts[a]; });
          target = undone.filter(function(it){ return it.subject === keys[0]; })[0];
          reason = '开始写「' + keys[0] + '」，共 ' + counts[keys[0]] + ' 项';
        } else {
          target = undone[0];
          reason = '按顺序来';
        }
      }
    } else {
      var subs = pickableSubjects();
      if(subs.length){
        var s = subs[Math.floor(Math.random()*subs.length)];
        target = undone.filter(function(it){ return it.subject === s; })[0];
        reason = '随机抽到「' + s + '」';
      } else {
        target = undone[Math.floor(Math.random()*undone.length)];
        reason = '随机挑一项';
      }
    }
    var idx = items.indexOf(target);
    suggestBody.innerHTML = '';
    suggestHead.textContent = '🎯 下一个建议写 · ' + reason;
    if(target.subject){
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = COLORS[target.subject] || '#999';
      tag.textContent = target.subject;
      suggestBody.appendChild(tag);
    }
    var txt = document.createElement('span');
    txt.className = 'suggest-text';
    txt.textContent = target.text;
    suggestBody.appendChild(txt);
    var btn = document.createElement('button');
    btn.className = 'do-btn';
    btn.textContent = '完成它 ✓';
    btn.addEventListener('click', function(){
      items[idx].done = true;
      if(target.subject){ lastSubject = target.subject; localStorage.setItem(KEY + '-last', lastSubject); }
      save(); render(); suggest();
    });
    suggestBody.appendChild(btn);
    var skbtn = document.createElement('button');
    skbtn.className = 'skip-btn';
    skbtn.textContent = '跳过它 ⏭';
    skbtn.setAttribute('aria-label','暂时跳过这项推荐');
    skbtn.addEventListener('click', function(){
      items[idx].skipped = true;
      items[idx].done = false;
      save(); render();
    });
    suggestBody.appendChild(skbtn);
  }

  function refreshSubjects(){
    var subs = pickableSubjects();
    var cur = pickSubject.value;
    pickSubject.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '自动';
    pickSubject.appendChild(opt0);
    subs.forEach(function(s){
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      pickSubject.appendChild(o);
    });
    if(subs.indexOf(cur) !== -1) pickSubject.value = cur;
    else pick = '';
  }

  document.getElementById('modeGroup').addEventListener('click', function(){
    mode = 'group'; pick = '';
    document.getElementById('modeGroup').classList.add('active');
    document.getElementById('modeRandom').classList.remove('active');
    pickSubject.value = '';
    refreshSubjects(); suggest();
  });
  document.getElementById('modeRandom').addEventListener('click', function(){
    mode = 'random'; pick = '';
    document.getElementById('modeRandom').classList.add('active');
    document.getElementById('modeGroup').classList.remove('active');
    pickSubject.value = '';
    refreshSubjects(); suggest();
  });
  pickSubject.addEventListener('change', function(){
    pick = pickSubject.value;
    if(pick) {
      mode = 'group';
      document.getElementById('modeGroup').classList.add('active');
      document.getElementById('modeRandom').classList.remove('active');
    }
    suggest();
  });

  var SUBJECT_ORDER = ['语文','数学','英语','历史','政治','化学','物理'];

  function render(){
    list.innerHTML = '';
    var done = 0;
    // 按科目分组：同科作业聚在一起，顺序固定 语数英史政化+物理，最后"其他"
    var groups = {};
    items.forEach(function(item){
      var s = item.subject || '其他';
      if(!groups[s]) groups[s] = [];
      groups[s].push(item);
    });
    function renderGroup(sub){
      var arr = groups[sub];
      if(!arr || !arr.length) return;
      arr = arr.slice().sort(function(a,b){ return (a.skipped?1:0) - (b.skipped?1:0); });
      var title = document.createElement('div');
      title.className = 'group-title';
      var dot = document.createElement('span');
      dot.className = 'group-dot';
      dot.style.background = COLORS[sub] || '#6b7686';
      title.appendChild(dot);
      title.appendChild(document.createTextNode(sub));
      list.appendChild(title);
      arr.forEach(function(item, i){
        if(item.done) done++;
        var li = document.createElement('li');
        if(item.done) li.className = 'done';
        else if(item.skipped) li.className = 'skipped';
        var check = document.createElement('span');
        check.className = 'check';
        check.setAttribute('aria-label','完成');
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>';
        check.addEventListener('click', function(){ toggleDone(items.indexOf(item)); });
        var text = document.createElement('span');
        text.className = 'text';
        text.appendChild(document.createTextNode(item.text));
        text.addEventListener('click', function(){ toggleDone(items.indexOf(item)); });
        var del = document.createElement('button');
        del.className = 'del';
        del.innerHTML = '×';
        del.setAttribute('aria-label','删除');
        del.addEventListener('click', function(){ items.splice(items.indexOf(item),1); save(); render(); });
        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    SUBJECT_ORDER.forEach(renderGroup);
    renderGroup('其他');
    var pct = items.length ? Math.round(done/items.length*100) : 0;
    bar.style.width = pct + '%';
    ptext.textContent = items.length ? '已完成 ' + done + ' / ' + items.length + ' 项' : '还没有作业';
    refreshSubjects();
    suggest();
  }

  function toggleDone(idx){
    items[idx].done = !items[idx].done;
    if(items[idx].done && items[idx].subject){
      lastSubject = items[idx].subject;
      localStorage.setItem(KEY + '-last', lastSubject);
    }
    save(); render();
  }

  function toggleSkip(idx){
    items[idx].skipped = !items[idx].skipped;
    if(items[idx].skipped) items[idx].done = false;
    save(); render();
  }

  function add(){
    var v = input.value.trim();
    if(!v) return;
    var subject = document.getElementById('newSubject').value || '';
    items.push({ text: v, subject: subject, done: false, skipped: false });
    input.value = '';
    document.getElementById('newSubject').value = '';
    save();
    render();
    input.focus();
  }
  document.getElementById('addBtn').addEventListener('click', add);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') add(); });

  // 作业原图：有照片就显示
  if(PHOTO){
    var photoCard = document.getElementById('photoCard');
    var photoImg = document.getElementById('photoImg');
    var photoLink = document.getElementById('photoLink');
    photoImg.src = PHOTO;
    photoLink.href = PHOTO;
    photoCard.style.display = 'block';
  }

  render();
})();
</script>
</body>
</html>
