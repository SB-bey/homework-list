<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ece7de">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>作业清单 · 10月3日</title>
<style>
  /* ================================================================
     1. 变量与基础
     ================================================================ */
  :root {
    color-scheme: light;

    /* 背景底层 */
    --bg-base: #ece7de;

    /* 文字 */
    --text: #1e1c19;
    --text-2: #56524b;
    --text-3: #8a857c;

    /* 强调色（暖橘） */
    --accent: #d97757;
    --accent-2: #c4674a;
    --accent-soft: rgba(217, 119, 87, 0.14);

    /* 危险色 */
    --danger: #c9544e;
    --danger-soft: rgba(201, 84, 78, 0.14);

    /* 液态玻璃核心令牌 —— 严格对照教程 */
    --glass-bg: rgba(255, 255, 255, 0.15);
    --glass-bg-hover: rgba(255, 255, 255, 0.22);
    --glass-bg-strong: rgba(255, 255, 255, 0.28);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-border-hi: rgba(255, 255, 255, 0.9);
    --glass-shadow: rgba(31, 38, 135, 0.16);
    --glass-inset: rgba(255, 255, 255, 0.3);

    /* 圆角 */
    --r-card: 28px;
    --r-md: 16px;
    --r-sm: 12px;

    /* 缓动 */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg-base: #14130f;
      --text: #f2ede4;
      --text-2: #a59e92;
      --text-3: #756f65;
      --accent: #e18d6d;
      --accent-2: #d0785a;
      --accent-soft: rgba(225, 141, 109, 0.15);
      --danger: #e58480;
      --danger-soft: rgba(229, 132, 128, 0.15);

      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-bg-hover: rgba(255, 255, 255, 0.12);
      --glass-bg-strong: rgba(255, 255, 255, 0.16);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-border-hi: rgba(255, 255, 255, 0.4);
      --glass-shadow: rgba(0, 0, 0, 0.4);
      --glass-inset: rgba(255, 255, 255, 0.14);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-base);
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding:
      max(20px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    overflow-x: hidden;
  }

  input, textarea { user-select: text; -webkit-user-select: text; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 8px;
  }

  /* ================================================================
     2. SVG 滤镜定义容器（教程中的折射滤镜）
     ================================================================ */
  .svg-filters {
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
    /* 注意：不要用 display:none，Safari 会失效滤镜 */
  }

  /* ================================================================
     3. 背景光斑（液态玻璃必须的背景）
     ================================================================ */
  .bg-shapes {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.85;
    will-change: transform;
  }

  .blob-1 {
    width: 60vw; height: 60vw;
    max-width: 520px; max-height: 520px;
    top: -12%; left: -8%;
    background: radial-gradient(circle, #ff8c5a 0%, #ffb088 55%, transparent 72%);
    animation: float1 22s var(--ease) infinite alternate;
  }

  .blob-2 {
    width: 55vw; height: 55vw;
    max-width: 480px; max-height: 480px;
    top: 12%; right: -14%;
    background: radial-gradient(circle, #7dd3fc 0%, #a5b4fc 55%, transparent 72%);
    animation: float2 26s var(--ease) infinite alternate;
  }

  .blob-3 {
    width: 65vw; height: 65vw;
    max-width: 560px; max-height: 560px;
    bottom: -18%; left: 22%;
    background: radial-gradient(circle, #f0abfc 0%, #fbcfe8 55%, transparent 72%);
    animation: float3 30s var(--ease) infinite alternate;
  }

  @keyframes float1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8%, 6%) scale(1.1); }
  }
  @keyframes float2 {
    from { transform: translate(0, 0) scale(1.05); }
    to   { transform: translate(-6%, 10%) scale(0.95); }
  }
  @keyframes float3 {
    from { transform: translate(0, 0) scale(0.95); }
    to   { transform: translate(5%, -8%) scale(1.08); }
  }

  @media (prefers-color-scheme: dark) {
    .blob { opacity: 0.55; filter: blur(100px); }
  }

  /* ================================================================
     4. 液态玻璃基础类
     严格照搬教程结构：
       .glass        —— 半透明 + backdrop-filter + 内阴影
       .glass::after —— 内嵌光泽层（inset box-shadow + 反光）
     ================================================================ */
  .glass {
    position: relative;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    /* 双层声明：不支持 url() 的浏览器会自动回退到上面一行 */
    backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: url(#liquid-distort) blur(3px) saturate(200%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-card);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      inset 0 4px 20px var(--glass-inset);
  }

  .glass::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.08);
    border-radius: inherit;
    -webkit-backdrop-filter: blur(1px);
    backdrop-filter: blur(1px);
    box-shadow:
      inset -10px -8px 0 -11px rgba(255, 255, 255, 0.95),
      inset 0 -9px 0 -8px rgba(255, 255, 255, 0.95);
    opacity: 0.6;
    z-index: -1;
    filter: blur(0.5px) brightness(115%);
    pointer-events: none;
  }

  @media (prefers-color-scheme: dark) {
    .glass::after {
      background: rgba(255, 255, 255, 0.04);
      box-shadow:
        inset -10px -8px 0 -11px rgba(255, 255, 255, 0.4),
        inset 0 -9px 0 -8px rgba(255, 255, 255, 0.4);
    }
  }

  /* ================================================================
     5. 卡片主体
     ================================================================ */
  .card {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: clamp(20px, 5.2vw, 32px);
    animation: cardIn 0.8s var(--ease-out) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  /* ================================================================
     6. 头部
     ================================================================ */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 14px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(22px, 5.8vw, 27px);
    font-weight: 650;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  .date {
    font-size: 13px;
    color: var(--text-3);
    margin-left: auto;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .sub {
    font-size: 13.5px;
    color: var(--text-2);
    margin-bottom: 22px;
    opacity: 0.85;
  }

  /* ================================================================
     7. 进度
     ================================================================ */
  .progress-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 9px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  @media (prefers-color-scheme: dark) {
    .progress-track {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(217, 119, 87, 0.55);
    transition: width 0.6s var(--ease);
  }

  .progress-text {
    font-size: 12.5px;
    color: var(--text-3);
    text-align: right;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
  }

  /* ================================================================
     8. 建议卡片 —— 向外呼吸光晕
     ================================================================ */
  .suggest {
    position: relative;
    background: var(--accent-soft);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: url(#liquid-distort) blur(3px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: var(--r-md);
    padding: 16px;
    margin-bottom: 18px;
    box-shadow:
      0 0 0 0.5px rgba(217, 119, 87, 0.08),
      0 0 22px -4px rgba(217, 119, 87, 0.22),
      0 0 50px -10px rgba(217, 119, 87, 0.14),
      inset 0 4px 20px rgba(255, 255, 255, 0.3);
    animation: suggestGlow 4.5s var(--ease) infinite;
    overflow: hidden;
  }

  @media (prefers-color-scheme: dark) {
    .suggest {
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow:
        0 0 0 0.5px rgba(225, 141, 109, 0.14),
        0 0 24px -4px rgba(225, 141, 109, 0.28),
        0 0 60px -10px rgba(225, 141, 109, 0.16),
        inset 0 4px 20px rgba(255, 255, 255, 0.08);
    }
  }

  @keyframes suggestGlow {
    0%, 100% {
      box-shadow:
        0 0 0 0.5px rgba(217, 119, 87, 0.08),
        0 0 18px -4px rgba(217, 119, 87, 0.18),
        0 0 40px -10px rgba(217, 119, 87, 0.10),
        inset 0 4px 20px rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow:
        0 0 0 0.5px rgba(217, 119, 87, 0.18),
        0 0 32px -2px rgba(217, 119, 87, 0.34),
        0 0 68px -6px rgba(217, 119, 87, 0.2),
        inset 0 4px 20px rgba(255, 255, 255, 0.35);
    }
  }

  /* 点击脉冲光 */
  .suggest::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 0 55px 12px rgba(217, 119, 87, 0.55);
    opacity: 0;
    z-index: 2;
  }

  .suggest.pulse::before {
    animation: suggestPulse 0.8s var(--ease-out);
  }

  @keyframes suggestPulse {
    0%   { opacity: 0.85; transform: scale(1); }
    100% { opacity: 0;    transform: scale(1.05); }
  }

  .suggest-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }

  .suggest-eyebrow {
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .suggest-reason {
    font-size: 12.5px;
    color: var(--text-2);
  }

  .suggest-body {
    position: relative;
    z-index: 1;
  }

  .suggest-task {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
  }

  .suggest-text {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: anywhere;
    min-width: 0;
  }

  .suggest-empty {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-2);
    margin-bottom: 13px;
  }

  .suggest-actions {
    display: flex;
    gap: 8px;
  }

  .suggest-actions .glass-btn { flex: 1; }

  /* ================================================================
     9. 科目标签
     ================================================================ */
  .tag {
    display: inline-flex;
    align-items: center;
    height: 21px;
    padding: 0 9px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ================================================================
     10. 玻璃按钮（教程核心）
     ================================================================ */
  .glass-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 42px;
    padding: 0 18px;
    border-radius: var(--r-sm);
    font-size: 14px;
    font-weight: 550;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    isolation: isolate;

    /* 液态玻璃核心（教程基础样式） */
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: url(#liquid-distort) blur(3px) saturate(200%);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      inset 0 4px 20px var(--glass-inset);

    transition:
      background-color 0.28s var(--ease),
      box-shadow 0.28s var(--ease),
      transform 0.2s var(--spring),
      color 0.2s var(--ease),
      border-color 0.28s var(--ease);
  }

  /* 教程光泽伪元素 */
  .glass-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.08);
    border-radius: inherit;
    -webkit-backdrop-filter: blur(1px);
    backdrop-filter: blur(1px);
    box-shadow:
      inset -10px -8px 0 -11px rgba(255, 255, 255, 0.95),
      inset 0 -9px 0 -8px rgba(255, 255, 255, 0.95);
    opacity: 0.6;
    z-index: -1;
    filter: blur(0.5px) brightness(115%);
    pointer-events: none;
  }

  @media (prefers-color-scheme: dark) {
    .glass-btn::after {
      background: rgba(255, 255, 255, 0.04);
      box-shadow:
        inset -10px -8px 0 -11px rgba(255, 255, 255, 0.35),
        inset 0 -9px 0 -8px rgba(255, 255, 255, 0.35);
    }
  }

  .glass-btn > * { position: relative; z-index: 1; }

  .glass-btn:active { transform: scale(0.965); }

  /* 主按钮：暖橘玻璃 */
  .glass-btn.primary {
    color: #fff;
    background: rgba(217, 119, 87, 0.42);
    border-color: rgba(255, 255, 255, 0.68);
    box-shadow:
      0 8px 32px rgba(217, 119, 87, 0.28),
      inset 0 4px 20px rgba(255, 255, 255, 0.38);
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
  }

  /* ================================================================
     11. 模式胶囊
     ================================================================ */
  .suggest-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-top: 13px;
    padding-top: 13px;
    border-top: 1px solid rgba(217, 119, 87, 0.14);
    position: relative;
    z-index: 1;
  }

  .mode-label {
    font-size: 12px;
    color: var(--text-3);
  }

  .mode-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    overflow: hidden;
    isolation: isolate;

    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: blur(2px) saturate(180%);
    box-shadow:
      0 4px 16px rgba(31, 38, 135, 0.12),
      inset 0 2px 10px rgba(255, 255, 255, 0.3);

    transition:
      background-color 0.22s var(--ease),
      color 0.22s var(--ease),
      transform 0.18s var(--spring),
      box-shadow 0.24s var(--ease);
  }

  .mode-btn:active { transform: scale(0.94); }

  .mode-btn.active {
    color: #fff;
    background: rgba(217, 119, 87, 0.42);
    border-color: rgba(255, 255, 255, 0.68);
    box-shadow:
      0 6px 22px rgba(217, 119, 87, 0.28),
      inset 0 2px 10px rgba(255, 255, 255, 0.42);
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
  }

  /* ================================================================
     12. 下拉选择
     ================================================================ */
  select {
    -webkit-appearance: none;
    appearance: none;
    height: 30px;
    padding: 0 30px 0 12px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background-color: var(--glass-bg);
    -webkit-backdrop-filter: blur(4px) saturate(160%);
    backdrop-filter: blur(4px) saturate(160%);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238a857c' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--text-2);
    outline: none;
    max-width: 100%;
    transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
  }

  select option { background: var(--bg-base); color: var(--text); }

  /* ================================================================
     13. 原图
     ================================================================ */
  .photo {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(2px) saturate(180%);
    backdrop-filter: blur(2px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-md);
    padding: 14px;
    margin-bottom: 18px;
    box-shadow:
      0 8px 32px var(--glass-shadow),
      inset 0 4px 20px var(--glass-inset);
  }

  .photo-head {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    letter-spacing: 0.03em;
    margin-bottom: 11px;
  }

  .photo a { display: block; }

  .photo img {
    width: 100%;
    max-height: 68vh;
    object-fit: contain;
    display: block;
    border-radius: 10px;
    background: rgba(0,0,0,0.04);
    cursor: zoom-in;
  }

  /* ================================================================
     14. 列表
     ================================================================ */
  .list { list-style: none; }

  .group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-3);
    margin: 22px 0 2px;
  }

  .group-title:first-child { margin-top: 4px; }

  .group-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 2px;
    font-size: 16px;
    position: relative;
    border-radius: 10px;
    transition: background-color 0.2s var(--ease);
  }

  li.item + li.item { border-top: 1px solid rgba(255, 255, 255, 0.22); }

  @media (prefers-color-scheme: dark) {
    li.item + li.item { border-top-color: rgba(255, 255, 255, 0.06); }
  }

  /* 复选框 —— 玻璃小方块 */
  .check {
    position: relative;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 7px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition:
      background-color 0.24s var(--ease),
      border-color 0.24s var(--ease),
      transform 0.22s var(--spring);
  }

  .check::after {
    content: "";
    position: absolute;
    inset: -11px;
  }

  .check:active { transform: scale(0.9); }

  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.55);
    transition:
      opacity 0.2s var(--ease),
      transform 0.26s var(--spring);
  }

  li.item.done .check {
    background: rgba(217, 119, 87, 0.9);
    border-color: rgba(255, 255, 255, 0.6);
  }

  li.item.done .check svg {
    opacity: 1;
    transform: scale(1);
  }

  .text {
    flex: 1;
    min-width: 0;
    cursor: pointer;
    line-height: 1.5;
    word-break: break-word;
    overflow-wrap: anywhere;
    transition: color 0.25s var(--ease), opacity 0.25s var(--ease);
  }

  li.item.done .text {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    text-decoration-color: var(--text-3);
  }

  li.item.skipped .text {
    color: var(--text-3);
    opacity: 0.7;
    font-style: italic;
    text-decoration: line-through;
    text-decoration-style: dotted;
    text-decoration-thickness: 1px;
  }

  li.item.skipped .check { opacity: 0.45; }

  /* 恢复按钮 —— 玻璃胶囊 */
  .restore {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    flex-shrink: 0;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 550;
    color: var(--accent);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.3);
    transition:
      background-color 0.2s var(--ease),
      transform 0.18s var(--spring),
      box-shadow 0.24s var(--ease);
  }

  .restore:active { transform: scale(0.93); }

  .del {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    opacity: 0.55;
    transition:
      opacity 0.2s var(--ease),
      color 0.2s var(--ease),
      background-color 0.2s var(--ease),
      transform 0.18s var(--spring);
  }

  .del svg { width: 14px; height: 14px; }

  .del:active { transform: scale(0.88); opacity: 1; }

  /* ================================================================
     15. 添加栏
     ================================================================ */
  .add-bar {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    align-items: stretch;
  }

  .add-bar input,
  .add-bar select {
    height: 44px;
    border-radius: var(--r-sm);
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    backdrop-filter: blur(6px) saturate(160%);
    box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.25);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition:
      border-color 0.22s var(--ease),
      box-shadow 0.22s var(--ease),
      background-color 0.22s var(--ease);
  }

  .add-bar input {
    flex: 1;
    min-width: 0;
    padding: 0 14px;
  }

  .add-bar input::placeholder { color: var(--text-3); }

  .add-bar input:focus,
  .add-bar select:focus {
    border-color: var(--accent);
    box-shadow:
      inset 0 2px 8px rgba(255, 255, 255, 0.3),
      0 0 0 3px rgba(217, 119, 87, 0.18);
  }

  .add-bar select {
    flex-shrink: 0;
    width: 92px;
    padding: 0 28px 0 12px;
    font-size: 15px;
    border-radius: var(--r-sm);
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238a857c' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 11px center;
  }

  .add-bar .glass-btn {
    height: 44px;
    padding: 0 22px;
    flex-shrink: 0;
  }

  /* ================================================================
     16. 底部操作
     ================================================================ */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .actions .glass-btn {
    flex: 1;
    height: 40px;
    padding: 0 10px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-2);
  }

  .actions .glass-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .actions .glass-btn.armed {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: rgba(201, 84, 78, 0.35);
    box-shadow:
      0 8px 28px rgba(201, 84, 78, 0.28),
      inset 0 4px 20px rgba(255, 255, 255, 0.3);
    animation: armedPulse 1.4s var(--ease) infinite;
  }

  @keyframes armedPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.65; }
  }

  /* ================================================================
     17. 提示与空状态
     ================================================================ */
  .hint {
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
    line-height: 1.7;
    margin-top: 20px;
  }

  .empty {
    text-align: center;
    padding: 28px 12px 24px;
    color: var(--text-3);
  }

  .empty-mark {
    font-size: 26px;
    margin-bottom: 10px;
    opacity: 0.6;
  }

  .empty-main {
    font-size: 14.5px;
    color: var(--text-2);
    margin-bottom: 3px;
  }

  .empty-sub {
    font-size: 12.5px;
    color: var(--text-3);
  }

  /* ================================================================
     18. 悬停（教程：玻璃 hover 加强）
     ================================================================ */
  @media (hover: hover) and (pointer: fine) {
    li.item:hover { background: rgba(255, 255, 255, 0.14); }

    @media (prefers-color-scheme: dark) {
      li.item:hover { background: rgba(255, 255, 255, 0.05); }
    }

    .check:hover { border-color: var(--accent); }

    /* 教程 hover 样式 */
    .glass-btn:hover {
      background: var(--glass-bg-hover);
      box-shadow:
        0 12px 40px rgba(31, 38, 135, 0.22),
        inset 0 4px 20px rgba(255, 255, 255, 0.35);
    }

    .glass-btn.primary:hover {
      background: rgba(217, 119, 87, 0.55);
      box-shadow:
        0 12px 40px rgba(217, 119, 87, 0.35),
        inset 0 4px 20px rgba(255, 255, 255, 0.42);
    }

    .mode-btn:hover:not(.active) {
      background: var(--glass-bg-hover);
      color: var(--text);
    }

    .del:hover {
      opacity: 1;
      color: var(--danger);
      background: var(--danger-soft);
    }

    .restore:hover {
      background: var(--glass-bg-hover);
    }
  }

  /* ================================================================
     19. 响应式
     ================================================================ */
  @media (min-width: 600px) {
    .card { max-width: 660px; }
    .suggest-actions .glass-btn { flex: 0 0 auto; min-width: 106px; }
    li.item { padding: 14px 2px; }
  }

  @media (min-width: 1024px) {
    .card { max-width: 700px; }
  }

  @media (max-width: 479px) {
    .add-bar { flex-wrap: wrap; }
    .add-bar input { order: 1; flex: 1 1 100%; }
    .add-bar select { order: 2; flex: 1 1 0; width: auto; }
    .add-bar .glass-btn { order: 3; flex: 1 1 0; padding: 0; }
  }

  /* ================================================================
     20. 减少动效
     ================================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }

    .suggest {
      box-shadow:
        0 0 0 0.5px rgba(217, 119, 87, 0.1),
        0 0 26px -4px rgba(217, 119, 87, 0.22),
        inset 0 4px 20px rgba(255, 255, 255, 0.3);
    }
  }
</style>
</head>
<body>

<!-- ================================================================
     SVG 折射滤镜（教程核心：feTurbulence + feDisplacementMap）
     ================================================================ -->
<svg class="svg-filters" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid-distort" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.008"
                    numOctaves="2"
                    result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="blurred"/>
      <feDisplacementMap in="SourceGraphic"
                         in2="blurred"
                         scale="15"
                         xChannelSelector="R"
                         yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- ================================================================
     背景光斑（让玻璃有东西可折射）
     ================================================================ -->
<div class="bg-shapes" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- ================================================================
     主卡片
     ================================================================ -->
<main class="card glass">
  <div class="header">
    <h1>作业清单</h1>
    <span class="date" id="dateLabel">10月3日 · 周六</span>
  </div>
  <p class="sub">点条目或方块划掉，进度自动保存</p>

  <div class="progress-track">
    <div class="progress-fill" id="bar"></div>
  </div>
  <div class="progress-text" id="ptext"></div>

  <section class="suggest" id="suggestCard">
    <div class="suggest-head">
      <span class="suggest-eyebrow">下一个建议</span>
      <span class="suggest-reason" id="suggestReason"></span>
    </div>
    <div class="suggest-body" id="suggestBody"></div>
    <div class="suggest-controls">
      <span class="mode-label">模式</span>
      <button class="mode-btn active" id="modeGroup" type="button">同科优先</button>
      <button class="mode-btn" id="modeRandom" type="button">随机</button>
      <span class="mode-label" style="margin-left:2px;">科目</span>
      <select id="pickSubject" aria-label="指定科目">
        <option value="">自动</option>
      </select>
    </div>
  </section>

  <section class="photo" id="photoCard" style="display:none">
    <div class="photo-head">作业原图 · 点开看大图</div>
    <a id="photoLink" href="#" target="_blank" rel="noopener">
      <img id="photoImg" src="" alt="作业原图">
    </a>
  </section>

  <ul class="list" id="list"></ul>

  <div class="add-bar">
    <select id="newSubject" aria-label="选择科目">
      <option value="">科目</option>
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="历史">历史</option>
      <option value="政治">政治</option>
      <option value="化学">化学</option>
      <option value="物理">物理</option>
    </select>
    <input id="newItem" type="text" placeholder="添加一条作业…" maxlength="60">
    <button class="glass-btn primary" id="addBtn" type="button">添加</button>
  </div>

  <div class="actions">
    <button class="glass-btn" id="clearDone" type="button">清除已完成</button>
    <button class="glass-btn" id="resetAll" type="button">重置全部</button>
  </div>

  <p class="hint">跳过的条目可以恢复，推荐不喜欢就换一个</p>
</main>

<script>
/* ================================================================
   应用逻辑（保持上一版功能不变）
   ================================================================ */
(function () {
  'use strict';

  var COLORS = {
    '语文': '#C77B9E',
    '数学': '#6B8FD4',
    '英语': '#5FAE7F',
    '历史': '#9B7BC4',
    '政治': '#CC7B7B',
    '化学': '#5BA8A8',
    '物理': '#D99B5A'
  };

  var SUBJECT_ORDER = ['语文', '数学', '英语', '历史', '政治', '化学', '物理'];

  var CHECK_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="5 12.5 10 17.5 19 7"/></svg>';

  var X_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round">' +
    '<path d="M6 6l12 12M18 6L6 18"/></svg>';

  var KEY = '';
  var PHOTO = '';
  var items = [];
  var uid = 0;
  var mode = 'group';
  var pick = '';
  var lastSubject = '';

  var listEl        = document.getElementById('list');
  var inputEl       = document.getElementById('newItem');
  var barEl         = document.getElementById('bar');
  var ptextEl       = document.getElementById('ptext');
  var suggestBody   = document.getElementById('suggestBody');
  var suggestReason = document.getElementById('suggestReason');
  var suggestCard   = document.getElementById('suggestCard');
  var pickSubject   = document.getElementById('pickSubject');
  var clearDoneBtn  = document.getElementById('clearDone');
  var resetAllBtn   = document.getElementById('resetAll');
  var modeGroupBtn  = document.getElementById('modeGroup');
  var modeRandomBtn = document.getElementById('modeRandom');
  var dateLabel     = document.getElementById('dateLabel');

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function buzz(ms) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) {}
    }
  }

  function hexToRgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function colorOf(subject) {
    return COLORS[subject] || '#8E8880';
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  var pulseTimer = null;
  function pulseSuggest() {
    if (!suggestCard) return;
    suggestCard.classList.remove('pulse');
    void suggestCard.offsetWidth;
    suggestCard.classList.add('pulse');
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(function () {
      suggestCard.classList.remove('pulse');
    }, 820);
  }

  function pickableSubjects() {
    var seen = [];
    items.forEach(function (it) {
      if (!it.done && !it.skipped && it.subject && seen.indexOf(it.subject) === -1) {
        seen.push(it.subject);
      }
    });
    return seen;
  }

  function suggest() {
    var undone = items.filter(function (it) { return !it.done && !it.skipped; });

    clear(suggestBody);
    suggestReason.textContent = '';

    if (!undone.length) {
      var skipped = items.filter(function (it) { return it.skipped; });
      var emptyEl = document.createElement('div');
      emptyEl.className = 'suggest-empty';

      if (skipped.length) {
        emptyEl.textContent = '待做的都处理完啦，还有 ' + skipped.length + ' 项被跳过';
        suggestBody.appendChild(emptyEl);

        var restoreAll = document.createElement('button');
        restoreAll.type = 'button';
        restoreAll.className = 'glass-btn primary';
        restoreAll.textContent = '恢复全部跳过';
        restoreAll.style.width = '100%';
        restoreAll.addEventListener('click', function () {
          items.forEach(function (it) { if (it.skipped) it.skipped = false; });
          save(); render();
        });
        suggestBody.appendChild(restoreAll);
      } else {
        emptyEl.textContent = '全部写完啦，去休息一会儿吧';
        suggestBody.appendChild(emptyEl);
      }
      return;
    }

    var target = null;
    var reason = '';

    if (pick) {
      var pu = undone.filter(function (it) { return it.subject === pick; });
      if (pu.length) {
        target = pu[0];
        reason = '指定科目「' + pick + '」';
      } else {
        suggestBody.innerHTML =
          '<div class="suggest-empty">「' + pick + '」已经写完啦</div>';
        return;
      }
    } else if (mode === 'group') {
      var lastUndone = null;
      var lu = [];
      if (lastSubject) {
        lu = undone.filter(function (it) { return it.subject === lastSubject; });
        if (lu.length) lastUndone = lu[0];
      }
      if (lastUndone) {
        target = lastUndone;
        reason = '接着写「' + lastSubject + '」，还剩 ' + lu.length + ' 项';
      } else {
        var counts = {};
        undone.forEach(function (it) {
          if (it.subject) counts[it.subject] = (counts[it.subject] || 0) + 1;
        });
        var keys = Object.keys(counts);
        if (keys.length) {
          keys.sort(function (a, b) { return counts[b] - counts[a]; });
          target = undone.filter(function (it) { return it.subject === keys[0]; })[0];
          reason = '开始写「' + keys[0] + '」，共 ' + counts[keys[0]] + ' 项';
        } else {
          target = undone[0];
          reason = '按顺序来';
        }
      }
    } else {
      var subs = pickableSubjects();
      if (subs.length) {
        var s = subs[Math.floor(Math.random() * subs.length)];
        target = undone.filter(function (it) { return it.subject === s; })[0];
        reason = '随机抽到「' + s + '」';
      } else {
        target = undone[Math.floor(Math.random() * undone.length)];
        reason = '随机挑一项';
      }
    }

    var idx = items.indexOf(target);
    suggestReason.textContent = reason;

    var taskRow = document.createElement('div');
    taskRow.className = 'suggest-task';

    if (target.subject) {
      var c = colorOf(target.subject);
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = target.subject;
      tag.style.color = c;
      tag.style.background = hexToRgba(c, 0.16);
      taskRow.appendChild(tag);
    }

    var txt = document.createElement('span');
    txt.className = 'suggest-text';
    txt.textContent = target.text;
    taskRow.appendChild(txt);

    suggestBody.appendChild(taskRow);

    var actions = document.createElement('div');
    actions.className = 'suggest-actions';

    var doBtn = document.createElement('button');
    doBtn.type = 'button';
    doBtn.className = 'glass-btn primary';
    doBtn.innerHTML = '<span>完成</span>';
    doBtn.addEventListener('click', function () {
      items[idx].done = true;
      items[idx].skipped = false;
      if (target.subject) {
        lastSubject = target.subject;
        try { localStorage.setItem(KEY + '-last', lastSubject); } catch (e) {}
      }
      buzz(12);
      pulseSuggest();
      save(); render();
    });

    var skipBtn = document.createElement('button');
    skipBtn.type = 'button';
    skipBtn.className = 'glass-btn';
    skipBtn.innerHTML = '<span>跳过</span>';
    skipBtn.addEventListener('click', function () {
      items[idx].skipped = true;
      items[idx].done = false;
      pulseSuggest();
      save(); render();
    });

    actions.appendChild(doBtn);
    actions.appendChild(skipBtn);
    suggestBody.appendChild(actions);
  }

  function refreshSubjects() {
    var subs = pickableSubjects();
    var cur = pickSubject.value;

    clear(pickSubject);

    var auto = document.createElement('option');
    auto.value = '';
    auto.textContent = '自动';
    pickSubject.appendChild(auto);

    subs.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s;
      o.textContent = s;
      pickSubject.appendChild(o);
    });

    if (subs.indexOf(cur) !== -1) {
      pickSubject.value = cur;
    } else {
      pick = '';
      pickSubject.value = '';
    }
  }

  function setMode(m) {
    mode = m;
    pick = '';
    pickSubject.value = '';

    modeGroupBtn.classList.toggle('active', m === 'group');
    modeRandomBtn.classList.toggle('active', m === 'random');

    try { localStorage.setItem(KEY + '-mode', m); } catch (e) {}

    refreshSubjects();
    suggest();
  }

  modeGroupBtn.addEventListener('click', function () { setMode('group'); });
  modeRandomBtn.addEventListener('click', function () { setMode('random'); });

  pickSubject.addEventListener('change', function () {
    pick = pickSubject.value;
    if (pick) {
      mode = 'group';
      modeGroupBtn.classList.add('active');
      modeRandomBtn.classList.remove('active');
    }
    suggest();
  });

  function buildItem(item) {
    var li = document.createElement('li');
    li.className = 'item';
    if (item.done) li.classList.add('done');
    else if (item.skipped) li.classList.add('skipped');

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('tabindex', '0');
    check.setAttribute('aria-checked', item.done ? 'true' : 'false');
    check.setAttribute('aria-label', '标记完成');
    check.innerHTML = CHECK_SVG;

    check.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleDone(item);
    });
    check.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleDone(item);
      }
    });

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text;
    text.addEventListener('click', function () { toggleDone(item); });

    li.appendChild(check);
    li.appendChild(text);

    if (item.skipped) {
      var rs = document.createElement('button');
      rs.type = 'button';
      rs.className = 'restore';
      rs.textContent = '恢复';
      rs.setAttribute('aria-label', '恢复这项作业');
      rs.addEventListener('click', function (e) {
        e.stopPropagation();
        item.skipped = false;
        save(); render();
      });
      li.appendChild(rs);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.innerHTML = X_SVG;
    del.setAttribute('aria-label', '删除');
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      var i = items.indexOf(item);
      if (i === -1) return;
      items.splice(i, 1);
      save(); render();
    });
    li.appendChild(del);

    return li;
  }

  function render() {
    clear(listEl);

    var done = 0;
    var skippedCount = 0;

    var groups = {};
    items.forEach(function (item) {
      var s = item.subject || '其他';
      if (!groups[s]) groups[s] = [];
      groups[s].push(item);
      if (item.done) done++;
      if (item.skipped) skippedCount++;
    });

    function renderGroup(sub) {
      var arr = groups[sub];
      if (!arr || !arr.length) return;

      arr = arr.slice().sort(function (a, b) {
        return (a.skipped ? 1 : 0) - (b.skipped ? 1 : 0);
      });

      var title = document.createElement('div');
      title.className = 'group-title';
      var dot = document.createElement('span');
      dot.className = 'group-dot';
      dot.style.background = colorOf(sub);
      title.appendChild(dot);
      title.appendChild(document.createTextNode(sub));
      listEl.appendChild(title);

      arr.forEach(function (item) {
        listEl.appendChild(buildItem(item));
      });
    }

    SUBJECT_ORDER.forEach(renderGroup);
    renderGroup('其他');

    if (!items.length) {
      var emptyBox = document.createElement('div');
      emptyBox.className = 'empty';

      var mark = document.createElement('div');
      mark.className = 'empty-mark';
      mark.textContent = '☁︎';

      var main = document.createElement('div');
      main.className = 'empty-main';
      main.textContent = '还没有作业';

      var sub = document.createElement('div');
      sub.className = 'empty-sub';
      sub.textContent = '在下面添加第一条吧';

      emptyBox.appendChild(mark);
      emptyBox.appendChild(main);
      emptyBox.appendChild(sub);
      listEl.appendChild(emptyBox);
    }

    var pct = items.length ? Math.round((done / items.length) * 100) : 0;
    barEl.style.width = pct + '%';

    if (!items.length) {
      ptextEl.textContent = '';
    } else {
      ptextEl.textContent = '已完成 ' + done + ' / ' + items.length +
        (skippedCount ? ' · 跳过 ' + skippedCount : '');
    }

    clearDoneBtn.disabled = !done;
    resetAllBtn.disabled = !items.length;

    refreshSubjects();
    suggest();
  }

  function toggleDone(item) {
    var i = items.indexOf(item);
    if (i === -1) return;

    items[i].done = !items[i].done;

    if (items[i].done) {
      items[i].skipped = false;
      if (items[i].subject) {
        lastSubject = items[i].subject;
        try { localStorage.setItem(KEY + '-last', lastSubject); } catch (e) {}
      }
      buzz(12);
    }

    save();
    render();
  }

  function add() {
    var v = inputEl.value.trim();
    if (!v) return;

    var subject = document.getElementById('newSubject').value || '';

    items.push({
      id: ++uid,
      text: v,
      subject: subject,
      done: false,
      skipped: false
    });

    inputEl.value = '';
    document.getElementById('newSubject').value = '';

    save();
    render();
    inputEl.focus();
  }

  document.getElementById('addBtn').addEventListener('click', add);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') add();
  });

  function twoStep(btn, fn) {
    var orig = btn.textContent;
    var armed = false;
    var timer = null;

    function disarm() {
      armed = false;
      btn.textContent = orig;
      btn.classList.remove('armed');
      clearTimeout(timer);
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;

      if (armed) {
        disarm();
        fn();
        return;
      }

      armed = true;
      btn.textContent = '再点一次';
      btn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
    });
  }

  twoStep(clearDoneBtn, function () {
    items = items.filter(function (it) { return !it.done; });
    save();
    render();
  });

  twoStep(resetAllBtn, function () {
    items.forEach(function (it) {
      it.done = false;
      it.skipped = false;
    });
    save();
    render();
  });

  fetch('data/latest.json?v=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (d) {
      KEY = d.key || 'hw-list';
      PHOTO = d.photo || '';

      if (d.label) dateLabel.textContent = d.label;

      try {
        items = JSON.parse(localStorage.getItem(KEY)) || null;
      } catch (e) {
        items = null;
      }

      if (!items) {
        items = d.items || [];
        save();
      }

      items.forEach(function (it) {
        if (!it.id) it.id = ++uid;
        else uid = Math.max(uid, it.id);
      });

      lastSubject = localStorage.getItem(KEY + '-last') || '';

      var savedMode = localStorage.getItem(KEY + '-mode');
      mode = (savedMode === 'random') ? 'random' : 'group';
      modeGroupBtn.classList.toggle('active', mode === 'group');
      modeRandomBtn.classList.toggle('active', mode === 'random');

      if (PHOTO) {
        document.getElementById('photoImg').src = PHOTO;
        document.getElementById('photoLink').href = PHOTO;
        document.getElementById('photoCard').style.display = 'block';
      }

      render();
    })
    .catch(function () {
      ptextEl.textContent = '暂时拉不到作业数据，刷新试试';
    });
})();
</script>
</body>
</html>
