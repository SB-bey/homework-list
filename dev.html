<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>作业清单 · 10月3日</title>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    color-scheme: light;

    --bg: #F4F2EE;
    --card: #FFFFFF;
    --field: #F4F2EE;
    --text: #1F1E1C;
    --text-2: #6B6862;
    --text-3: #A09B93;
    --border: rgba(0, 0, 0, 0.065);
    --border-2: rgba(0, 0, 0, 0.11);

    --accent: #D97757;
    --accent-press: #C4674A;
    --accent-soft: #FAF0EA;
    --accent-ring: rgba(217, 119, 87, 0.14);

    --danger: #C9544E;
    --danger-soft: #FBEFEE;

    --glow-rgb: 217 119 87;

    --r-card: 26px;
    --r-md: 16px;
    --r-sm: 11px;

    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.34, 1.4, 0.64, 1);

    --shadow-card:
      0 1px 2px rgba(0, 0, 0, 0.03),
      0 12px 32px -10px rgba(0, 0, 0, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #191817;
      --card: #232220;
      --field: #191817;
      --text: #F2F0EC;
      --text-2: #A39E96;
      --text-3: #77726B;
      --border: rgba(255, 255, 255, 0.075);
      --border-2: rgba(255, 255, 255, 0.14);

      --accent: #E08A6B;
      --accent-press: #D2795A;
      --accent-soft: #2E2622;
      --accent-ring: rgba(224, 138, 107, 0.18);

      --danger: #E58480;
      --danger-soft: #2E2222;

      --glow-rgb: 224 138 107;

      --shadow-card:
        0 1px 2px rgba(0, 0, 0, 0.25),
        0 12px 32px -10px rgba(0, 0, 0, 0.5);
    }
  }

  /* ========== 基础 ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    line-height: 1.5;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    padding:
      max(20px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
    user-select: none;
    -webkit-user-select: none;
  }

  input, textarea { user-select: text; -webkit-user-select: text; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ========== 卡片 ========== */
  .card {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    background: var(--card);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    padding: clamp(20px, 5.2vw, 32px);
    animation: cardIn 0.7s var(--ease-out) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  /* ========== 头部 ========== */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 14px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .header h1 {
    font-size: clamp(22px, 5.8vw, 27px);
    font-weight: 650;
    letter-spacing: -0.015em;
    color: var(--text);
  }

  .date {
    font-size: 13px;
    color: var(--text-3);
    margin-left: auto;
    text-align: right;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  .sub {
    font-size: 13.5px;
    color: var(--text-3);
    letter-spacing: 0.005em;
    margin-bottom: 22px;
  }

  /* ========== 进度 ========== */
  .progress-track {
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 9px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.55s var(--ease);
  }

  .progress-text {
    font-size: 12.5px;
    color: var(--text-3);
    text-align: right;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
  }

  /* ========== 建议卡片（向外呼吸光） ========== */
  .suggest {
    position: relative;
    background: var(--accent-soft);
    border-radius: var(--r-md);
    padding: 16px;
    margin-bottom: 18px;
    box-shadow:
      0 0 0 0.5px rgb(var(--glow-rgb) / 0.06),
      0 0 20px -4px rgb(var(--glow-rgb) / 0.16),
      0 0 46px -10px rgb(var(--glow-rgb) / 0.10);
    animation: suggestGlow 4.5s var(--ease) infinite;
  }

  @keyframes suggestGlow {
    0%, 100% {
      box-shadow:
        0 0 0 0.5px rgb(var(--glow-rgb) / 0.06),
        0 0 18px -4px rgb(var(--glow-rgb) / 0.14),
        0 0 40px -10px rgb(var(--glow-rgb) / 0.08);
    }
    50% {
      box-shadow:
        0 0 0 0.5px rgb(var(--glow-rgb) / 0.14),
        0 0 30px -2px rgb(var(--glow-rgb) / 0.28),
        0 0 66px -6px rgb(var(--glow-rgb) / 0.16);
    }
  }

  .suggest::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 0 52px 10px rgb(var(--glow-rgb) / 0.5);
    opacity: 0;
  }

  .suggest.pulse::after {
    animation: suggestPulse 0.78s var(--ease-out);
  }

  @keyframes suggestPulse {
    0%   { opacity: 0.85; transform: scale(1); }
    100% { opacity: 0;    transform: scale(1.045); }
  }

  .suggest-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .suggest-eyebrow {
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .suggest-reason {
    font-size: 12.5px;
    color: var(--text-3);
    letter-spacing: 0.01em;
  }

  .suggest-body { margin-bottom: 0; }

  .suggest-task {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
  }

  .suggest-text {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: anywhere;
    min-width: 0;
  }

  .suggest-empty {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-2);
    margin-bottom: 13px;
  }

  .suggest-actions {
    display: flex;
    gap: 8px;
  }

  .suggest-actions .btn { flex: 1; }

  /* ========== 标签 ========== */
  .tag {
    display: inline-flex;
    align-items: center;
    height: 21px;
    padding: 0 9px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ============================================================
     按钮基础
     液态玻璃由 JS 动态注入 backdrop-filter: url(#filter)
     下方 CSS 提供无 JS / 不支持的降级视觉
     ============================================================ */
  .btn {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    height: 40px;
    padding: 0 18px;
    border-radius: var(--r-sm);
    font-size: 14px;
    font-weight: 550;
    letter-spacing: 0.005em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    transition:
      transform 0.18s var(--spring),
      background-color 0.2s var(--ease),
      box-shadow 0.28s var(--ease),
      color 0.2s var(--ease),
      filter 0.2s var(--ease);
  }

  .btn:active { transform: scale(0.965); }

  /* 主按钮降级底色 */
  .btn-primary {
    color: #FFFFFF;
    background: linear-gradient(160deg, var(--accent) 0%, var(--accent-press) 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.42),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.78),
      inset 0 -1px 1px rgba(0, 0, 0, 0.10),
      0 1px 2px rgba(0, 0, 0, 0.06),
      0 6px 18px -5px rgb(var(--glow-rgb) / 0.55);
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
  }

  /* 玻璃反光扫过（增强液态感） */
  .btn-primary::after {
    content: '';
    position: absolute;
    top: -70%;
    left: -80%;
    width: 48%;
    height: 240%;
    background: linear-gradient(100deg,
      transparent 0%,
      rgba(255, 255, 255, 0.14) 34%,
      rgba(255, 255, 255, 0.58) 50%,
      rgba(255, 255, 255, 0.14) 66%,
      transparent 100%);
    transform: rotate(14deg);
    pointer-events: none;
    animation: sheen 5.6s var(--ease) infinite;
  }

  @keyframes sheen {
    0%, 60%   { left: -80%; }
    84%, 100% { left: 140%; }
  }

  /* 幽灵按钮降级底色 */
  .btn-ghost {
    color: var(--text-2);
    background: rgba(255, 255, 255, 0.55);
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.85),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.7),
      inset 0 -1px 1px rgba(0, 0, 0, 0.04),
      0 1px 2px rgba(0, 0, 0, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    .btn-ghost { background: rgba(255, 255, 255, 0.09); }
  }

  /* 液态玻璃已启用时，隐藏降级背景（让 JS 生成的折射层露出） */
  .btn[data-liquid-glass="on"].btn-primary {
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.34) 0%,
      rgba(255, 255, 255, 0.08) 42%,
      rgba(255, 255, 255, 0) 58%),
      linear-gradient(160deg, var(--accent) 0%, var(--accent-press) 100%);
  }

  .btn[data-liquid-glass="on"].btn-ghost {
    background: rgba(255, 255, 255, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    .btn[data-liquid-glass="on"].btn-ghost {
      background: rgba(255, 255, 255, 0.06);
    }
  }

  /* ========== 控制条 ========== */
  .suggest-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-top: 13px;
    padding-top: 13px;
    border-top: 1px solid rgb(var(--glow-rgb) / 0.12);
  }

  .mode-label {
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }

  /* 模式胶囊 */
  .mode-btn {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    height: 30px;
    padding: 0 13px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    background: rgba(255, 255, 255, 0.5);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.8),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.65),
      0 1px 2px rgba(0, 0, 0, 0.05);
    transition:
      transform 0.18s var(--spring),
      background-color 0.22s var(--ease),
      box-shadow 0.28s var(--ease),
      color 0.22s var(--ease);
  }

  @media (prefers-color-scheme: dark) {
    .mode-btn { background: rgba(255, 255, 255, 0.08); }
  }

  .mode-btn:active { transform: scale(0.94); }

  .mode-btn.active {
    color: #FFFFFF;
    background: linear-gradient(160deg, var(--accent) 0%, var(--accent-press) 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.38),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.72),
      0 2px 10px -2px rgb(var(--glow-rgb) / 0.55);
    font-weight: 600;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.10);
  }

  .mode-btn[data-liquid-glass="on"].active {
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.34) 0%,
      rgba(255, 255, 255, 0.05) 55%),
      linear-gradient(160deg, var(--accent) 0%, var(--accent-press) 100%);
  }

  /* 下拉框 */
  select {
    -webkit-appearance: none;
    appearance: none;
    height: 30px;
    padding: 0 30px 0 12px;
    border-radius: 999px;
    border: none;
    background-color: rgba(0, 0, 0, 0.045);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A09B93' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--text-2);
    outline: none;
    max-width: 100%;
    transition: background-color 0.2s var(--ease);
  }

  @media (prefers-color-scheme: dark) {
    select { background-color: rgba(255, 255, 255, 0.07); }
  }

  select option { background: var(--card); color: var(--text); }

  /* ========== 原图 ========== */
  .photo {
    background: var(--field);
    border-radius: var(--r-md);
    padding: 14px;
    margin-bottom: 18px;
  }

  .photo-head {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.03em;
    margin-bottom: 11px;
  }

  .photo a { display: block; }

  .photo img {
    width: 100%;
    max-height: 68vh;
    object-fit: contain;
    display: block;
    border-radius: 10px;
    background: var(--card);
    cursor: zoom-in;
  }

  /* ========== 列表 ========== */
  .list { list-style: none; }

  .group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-3);
    margin: 22px 0 2px;
  }

  .group-title:first-child { margin-top: 4px; }

  .group-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 2px;
    font-size: 16px;
    position: relative;
    border-radius: 10px;
    transition: background-color 0.2s var(--ease);
  }

  li.item + li.item { border-top: 1px solid var(--border); }

  .check {
    position: relative;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 7px;
    border: 1.5px solid var(--border-2);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    transition:
      background-color 0.24s var(--ease),
      border-color 0.24s var(--ease),
      transform 0.22s var(--spring);
  }

  .check::after {
    content: "";
    position: absolute;
    inset: -11px;
  }

  .check:active { transform: scale(0.9); }

  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.55);
    transition:
      opacity 0.2s var(--ease),
      transform 0.26s var(--spring);
  }

  li.item.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }

  li.item.done .check svg {
    opacity: 1;
    transform: scale(1);
  }

  .text {
    flex: 1;
    min-width: 0;
    cursor: pointer;
    line-height: 1.5;
    word-break: break-word;
    overflow-wrap: anywhere;
    transition: color 0.25s var(--ease), opacity 0.25s var(--ease);
  }

  li.item.done .text {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    text-decoration-color: var(--text-3);
  }

  li.item.skipped .text {
    color: var(--text-3);
    opacity: 0.7;
    font-style: italic;
    text-decoration: line-through;
    text-decoration-style: dotted;
    text-decoration-thickness: 1px;
  }

  li.item.skipped .check { opacity: 0.45; }

  /* 恢复按钮 */
  .restore {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    flex-shrink: 0;
    height: 28px;
    padding: 0 11px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 550;
    color: var(--accent);
    background: var(--accent-soft);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      inset 0 0 0 0.5px rgb(var(--glow-rgb) / 0.22),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.6),
      0 1px 2px rgba(0, 0, 0, 0.04);
    transition:
      background-color 0.2s var(--ease),
      transform 0.18s var(--spring),
      box-shadow 0.24s var(--ease);
  }

  .restore:active { transform: scale(0.93); }

  .del {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    opacity: 0.55;
    transition:
      opacity 0.2s var(--ease),
      color 0.2s var(--ease),
      background-color 0.2s var(--ease),
      transform 0.18s var(--spring);
  }

  .del svg { width: 14px; height: 14px; }

  .del:active {
    transform: scale(0.88);
    opacity: 1;
  }

  /* ========== 添加栏 ========== */
  .add-bar {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    align-items: stretch;
  }

  .add-bar input,
  .add-bar select {
    height: 44px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-2);
    background: var(--field);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition:
      border-color 0.22s var(--ease),
      box-shadow 0.22s var(--ease),
      background-color 0.22s var(--ease);
  }

  .add-bar input {
    flex: 1;
    min-width: 0;
    padding: 0 14px;
  }

  .add-bar input::placeholder { color: var(--text-3); }

  .add-bar input:focus,
  .add-bar select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .add-bar select {
    flex-shrink: 0;
    width: 92px;
    padding: 0 28px 0 12px;
    font-size: 15px;
    border-radius: var(--r-sm);
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23A09B93' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 11px center;
  }

  .add-bar .btn {
    height: 44px;
    padding: 0 22px;
    flex-shrink: 0;
  }

  /* ========== 底部操作 ========== */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .actions .btn {
    flex: 1;
    height: 40px;
    padding: 0 10px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-2);
  }

  .actions .btn:disabled {
    opacity: 0.38;
    cursor: not-allowed;
  }

  .actions .btn.armed {
    color: var(--danger);
    background: var(--danger-soft);
    box-shadow:
      inset 0 0 0 0.5px rgb(201 84 78 / 0.24),
      0 2px 10px -3px rgb(201 84 78 / 0.35);
    animation: armedPulse 1.4s var(--ease) infinite;
  }

  @keyframes armedPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.62; }
  }

  /* ========== 提示 ========== */
  .hint {
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
    line-height: 1.7;
    margin-top: 20px;
    letter-spacing: 0.01em;
  }

  /* ========== 空状态 ========== */
  .empty {
    text-align: center;
    padding: 28px 12px 24px;
    color: var(--text-3);
  }

  .empty-mark {
    font-size: 26px;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .empty-main {
    font-size: 14.5px;
    color: var(--text-2);
    margin-bottom: 3px;
  }

  .empty-sub {
    font-size: 12.5px;
    color: var(--text-3);
  }

  /* ========== 悬停 ========== */
  @media (hover: hover) and (pointer: fine) {
    li.item:hover { background: rgba(0, 0, 0, 0.018); }

    @media (prefers-color-scheme: dark) {
      li.item:hover { background: rgba(255, 255, 255, 0.025); }
    }

    .check:hover { border-color: var(--accent); }

    .btn-primary:hover {
      filter: brightness(1.05);
      box-shadow:
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.5),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.85),
        inset 0 -1px 1px rgba(0, 0, 0, 0.10),
        0 1px 2px rgba(0, 0, 0, 0.06),
        0 8px 22px -5px rgb(var(--glow-rgb) / 0.65);
    }

    .btn-ghost:hover { color: var(--text); }

    .mode-btn:not(.active):hover { color: var(--text); }

    .del:hover {
      opacity: 1;
      color: var(--danger);
      background: var(--danger-soft);
    }

    .restore:hover {
      box-shadow:
        inset 0 0 0 0.5px rgb(var(--glow-rgb) / 0.38),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.7),
        0 2px 10px -2px rgb(var(--glow-rgb) / 0.28);
    }
  }

  /* ========== 响应式 ========== */
  @media (min-width: 600px) {
    .card { max-width: 660px; }
    .suggest-actions .btn { flex: 0 0 auto; min-width: 106px; }
    li.item { padding: 14px 2px; }
  }

  @media (min-width: 1024px) {
    .card { max-width: 700px; }
  }

  @media (max-width: 479px) {
    .add-bar { flex-wrap: wrap; }
    .add-bar input { order: 1; flex: 1 1 100%; }
    .add-bar select { order: 2; flex: 1 1 0; width: auto; }
    .add-bar .btn { order: 3; flex: 1 1 0; padding: 0; }
  }

  /* ========== 减少动效 ========== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }

    .suggest {
      box-shadow:
        0 0 0 0.5px rgb(var(--glow-rgb) / 0.10),
        0 0 26px -4px rgb(var(--glow-rgb) / 0.20);
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>作业清单</h1>
    <span class="date" id="dateLabel">10月3日 · 周六</span>
  </div>
  <p class="sub">点条目或方块划掉，进度自动保存</p>

  <div class="progress-track">
    <div class="progress-fill" id="bar"></div>
  </div>
  <div class="progress-text" id="ptext"></div>

  <section class="suggest" id="suggestCard">
    <div class="suggest-head">
      <span class="suggest-eyebrow">下一个建议</span>
      <span class="suggest-reason" id="suggestReason"></span>
    </div>
    <div class="suggest-body" id="suggestBody"></div>
    <div class="suggest-controls">
      <span class="mode-label">模式</span>
      <button class="mode-btn active" id="modeGroup" type="button">同科优先</button>
      <button class="mode-btn" id="modeRandom" type="button">随机</button>
      <span class="mode-label" style="margin-left:2px;">科目</span>
      <select id="pickSubject" aria-label="指定科目">
        <option value="">自动</option>
      </select>
    </div>
  </section>

  <section class="photo" id="photoCard" style="display:none">
    <div class="photo-head">作业原图 · 点开看大图</div>
    <a id="photoLink" href="#" target="_blank" rel="noopener">
      <img id="photoImg" src="" alt="作业原图">
    </a>
  </section>

  <ul class="list" id="list"></ul>

  <div class="add-bar">
    <select id="newSubject" aria-label="选择科目">
      <option value="">科目</option>
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="历史">历史</option>
      <option value="政治">政治</option>
      <option value="化学">化学</option>
      <option value="物理">物理</option>
    </select>
    <input id="newItem" type="text" placeholder="添加一条作业…" maxlength="60">
    <button class="btn btn-primary" id="addBtn" type="button">添加</button>
  </div>

  <div class="actions">
    <button class="btn btn-ghost" id="clearDone" type="button">清除已完成</button>
    <button class="btn btn-ghost" id="resetAll" type="button">重置全部</button>
  </div>

  <p class="hint">跳过的条目可以恢复，推荐不喜欢就换一个</p>
</div>

<script>
/* ================================================================
   Liquid Glass Engine
   基于 Shu Ding (https://github.com/shuding/liquid-glass) 的
   SVG feImage + feDisplacementMap 折射方案，针对 HTML 按钮
   自适应尺寸。每个按钮单独生成一张位移映射图。
   ================================================================ */
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var XLINK_NS = 'http://www.w3.org/1999/xlink';

  /* ---------- SDF 与工具 ---------- */
  function smoothStep(a, b, t) {
    t = Math.max(0, Math.min(1, (t - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  // 圆角矩形 SDF：负值在内部，0 在边界，正值在外部
  function sdRoundedBox(px, py, bx, by, r) {
    var qx = Math.abs(px) - bx + r;
    var qy = Math.abs(py) - by + r;
    var mx = Math.max(qx, 0);
    var my = Math.max(qy, 0);
    return Math.min(Math.max(qx, qy), 0) + Math.sqrt(mx * mx + my * my) - r;
  }

  // SDF 梯度（指向外侧），用于计算折射方向
  function sdfGradient(px, py, bx, by, r) {
    var ax = Math.abs(px);
    var ay = Math.abs(py);
    var qx = ax - bx + r;
    var qy = ay - by + r;
    var sx = px >= 0 ? 1 : -1;
    var sy = py >= 0 ? 1 : -1;
    var gx, gy;

    if (qx > 0 && qy > 0) {
      var len = Math.sqrt(qx * qx + qy * qy) || 1;
      gx = sx * qx / len;
      gy = sy * qy / len;
    } else if (qx > qy) {
      gx = sx; gy = 0;
    } else {
      gx = 0; gy = sy;
    }
    return { x: gx, y: gy };
  }

  /* ---------- 位移映射图生成 ---------- */
  function generateDisplacementMap(w, h, cornerRadius, strength, edgeWidth) {
    var canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    var imgData = ctx.createImageData(w, h);
    var data = imgData.data;

    // 默认填中性灰（无位移）
    for (var i = 0; i < w * h; i++) {
      data[i * 4]     = 128;
      data[i * 4 + 1] = 128;
      data[i * 4 + 2] = 128;
      data[i * 4 + 3] = 255;
    }

    var cx = w / 2;
    var cy = h / 2;
    var bx = Math.max(0.5, w / 2 - 0.5);
    var by = Math.max(0.5, h / 2 - 0.5);
    var r = Math.max(0, Math.min(cornerRadius, Math.min(bx, by)));
    var ew = Math.max(0.5, Math.min(edgeWidth, Math.min(bx, by) * 0.95));

    var dxArr = new Float32Array(w * h);
    var dyArr = new Float32Array(w * h);
    var maxAbs = 0;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var px = x + 0.5 - cx;
        var py = y + 0.5 - cy;

        var d = sdRoundedBox(px, py, bx, by, r);
        if (d > 0) continue; // 外侧跳过

        var depth = -d;
        var t = 1 - smoothStep(0, ew, depth);
        var edgeFactor = t * t * (3 - 2 * t);

        if (edgeFactor < 0.002) continue;

        var g = sdfGradient(px, py, bx, by, r);
        var dx = -g.x * edgeFactor * strength;
        var dy = -g.y * edgeFactor * strength;

        var idx = y * w + x;
        dxArr[idx] = dx;
        dyArr[idx] = dy;

        var a = Math.max(Math.abs(dx), Math.abs(dy));
        if (a > maxAbs) maxAbs = a;
      }
    }

    if (maxAbs < 0.0001) maxAbs = 0.0001;
    var scale = maxAbs * 2;

    for (var k = 0; k < w * h; k++) {
      var dxv = dxArr[k];
      var dyv = dyArr[k];
      if (dxv === 0 && dyv === 0) continue;

      var rv = Math.round((dxv / scale + 0.5) * 255);
      var gv = Math.round((dyv / scale + 0.5) * 255);

      data[k * 4]     = rv < 0 ? 0 : (rv > 255 ? 255 : rv);
      data[k * 4 + 1] = gv < 0 ? 0 : (gv > 255 ? 255 : gv);
    }

    ctx.putImageData(imgData, 0, 0);
    return { dataURL: canvas.toDataURL('image/png'), scale: scale };
  }

  /* ---------- 位移图缓存 ---------- */
  var mapCache = new Map();
  function getMap(w, h, radius, strength, edgeWidth) {
    var key = w + '|' + h + '|' + radius.toFixed(1) + '|' +
      strength.toFixed(1) + '|' + edgeWidth.toFixed(1);

    var hit = mapCache.get(key);
    if (hit) return hit;

    hit = generateDisplacementMap(w, h, radius, strength, edgeWidth);
    mapCache.set(key, hit);

    if (mapCache.size > 80) {
      mapCache.delete(mapCache.keys().next().value);
    }
    return hit;
  }

  /* ============================================================
     LiquidGlass 管理器
     ============================================================ */
  function LiquidGlass() {
    this.svg = null;
    this.instances = new Map();
    this.idc = 0;
    this.ro = null;
    this.pending = new Set();
    this.rafId = null;
    this._init();
  }

  LiquidGlass.prototype._init = function () {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('width', '0');
    svg.setAttribute('height', '0');
    svg.style.cssText =
      'position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none;';
    document.body.appendChild(svg);
    this.svg = svg;

    var self = this;

    if (typeof ResizeObserver !== 'undefined') {
      this.ro = new ResizeObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          self.pending.add(entries[i].target);
        }
        if (self.rafId) return;
        self.rafId = requestAnimationFrame(function () {
          self.rafId = null;
          var targets = Array.from(self.pending);
          self.pending.clear();
          for (var j = 0; j < targets.length; j++) {
            self.refresh(targets[j]);
          }
        });
      });
    }

    var winRaf = null;
    window.addEventListener('resize', function () {
      if (winRaf) cancelAnimationFrame(winRaf);
      winRaf = requestAnimationFrame(function () {
        self.instances.forEach(function (inst, el) {
          self.refresh(el);
        });
      });
    });
  };

  LiquidGlass.prototype.apply = function (element, options) {
    if (this.instances.has(element)) return this.instances.get(element);

    var opts = {
      radius:     options && options.radius     != null ? options.radius     : 11,
      strength:   options && options.strength   != null ? options.strength   : 14,
      edgeWidth:  options && options.edgeWidth  != null ? options.edgeWidth  : 10,
      blur:       options && options.blur       != null ? options.blur       : 0.5,
      saturate:   options && options.saturate   != null ? options.saturate   : 1.8,
      brightness: options && options.brightness != null ? options.brightness : 1.04
    };

    var inst = {
      element: element,
      options: opts,
      id: null,
      filterEl: null,
      lastW: 0,
      lastH: 0
    };

    this.instances.set(element, inst);

    if (this.ro) this.ro.observe(element);

    this._build(inst);
    return inst;
  };

  LiquidGlass.prototype._build = function (inst) {
    var el = inst.element;
    var w = Math.max(1, Math.ceil(el.offsetWidth));
    var h = Math.max(1, Math.ceil(el.offsetHeight));

    if (inst.lastW === w && inst.lastH === h && inst.filterEl) return;

    inst.lastW = w;
    inst.lastH = h;

    if (inst.filterEl && inst.filterEl.parentNode) {
      inst.filterEl.parentNode.removeChild(inst.filterEl);
    }

    var id = 'lg-' + (++this.idc) + '-' +
      Math.random().toString(36).slice(2, 7);

    inst.id = id + '-f';

    var o = inst.options;
    var radius = Math.min(o.radius, Math.min(w, h) / 2);
    var edgeW  = Math.min(o.edgeWidth, Math.min(w, h) / 3);

    var map = getMap(w, h, radius, o.strength, edgeW);

    var filter = document.createElementNS(SVG_NS, 'filter');
    filter.setAttribute('id', inst.id);
    filter.setAttribute('filterUnits', 'userSpaceOnUse');
    filter.setAttribute('primitiveUnits', 'userSpaceOnUse');
    filter.setAttribute('colorInterpolationFilters', 'sRGB');
    filter.setAttribute('x', '0');
    filter.setAttribute('y', '0');
    filter.setAttribute('width', String(w));
    filter.setAttribute('height', String(h));

    var feImage = document.createElementNS(SVG_NS, 'feImage');
    feImage.setAttribute('id', inst.id + '-img');
    feImage.setAttribute('x', '0');
    feImage.setAttribute('y', '0');
    feImage.setAttribute('width', String(w));
    feImage.setAttribute('height', String(h));
    feImage.setAttribute('preserveAspectRatio', 'none');
    feImage.setAttributeNS(XLINK_NS, 'xlink:href', map.dataURL);
    feImage.setAttribute('href', map.dataURL);

    var feDisp = document.createElementNS(SVG_NS, 'feDisplacementMap');
    feDisp.setAttribute('in', 'SourceGraphic');
    feDisp.setAttribute('in2', inst.id + '-img');
    feDisp.setAttribute('xChannelSelector', 'R');
    feDisp.setAttribute('yChannelSelector', 'G');
    feDisp.setAttribute('scale', String(map.scale));

    filter.appendChild(feImage);
    filter.appendChild(feDisp);
    this.svg.appendChild(filter);

    inst.filterEl = filter;

    this._applyStyle(inst);
  };

  LiquidGlass.prototype._applyStyle = function (inst) {
    var el = inst.element;
    var o = inst.options;

    var bf = 'url(#' + inst.id + ') blur(' + o.blur + 'px) ' +
      'saturate(' + o.saturate + ') brightness(' + o.brightness + ')';

    el.style.setProperty('-webkit-backdrop-filter', bf);
    el.style.setProperty('backdrop-filter', bf);
    el.setAttribute('data-liquid-glass', 'on');
  };

  LiquidGlass.prototype.refresh = function (element) {
    var inst = this.instances.get(element);
    if (!inst) return;
    this._build(inst);
  };

  LiquidGlass.prototype.destroy = function (element) {
    var inst = this.instances.get(element);
    if (!inst) return;

    if (this.ro) this.ro.unobserve(element);

    if (inst.filterEl && inst.filterEl.parentNode) {
      inst.filterEl.parentNode.removeChild(inst.filterEl);
    }

    element.style.removeProperty('-webkit-backdrop-filter');
    element.style.removeProperty('backdrop-filter');
    element.removeAttribute('data-liquid-glass');

    this.instances.delete(element);
  };

  LiquidGlass.prototype.destroyAll = function () {
    var self = this;
    this.instances.forEach(function (inst, el) {
      self.destroy(el);
    });
  };

  window.LiquidGlass = LiquidGlass;
})();

/* ================================================================
   应用逻辑
   ================================================================ */
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var COLORS = {
    '语文': '#C77B9E',
    '数学': '#6B8FD4',
    '英语': '#5FAE7F',
    '历史': '#9B7BC4',
    '政治': '#CC7B7B',
    '化学': '#5BA8A8',
    '物理': '#D99B5A'
  };

  var SUBJECT_ORDER = ['语文', '数学', '英语', '历史', '政治', '化学', '物理'];

  var CHECK_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="5 12.5 10 17.5 19 7"/></svg>';

  var X_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round">' +
    '<path d="M6 6l12 12M18 6L6 18"/></svg>';

  /* ---------- 状态 ---------- */
  var KEY = '';
  var PHOTO = '';
  var items = [];
  var uid = 0;
  var mode = 'group';
  var pick = '';
  var lastSubject = '';

  /* ---------- DOM ---------- */
  var listEl        = document.getElementById('list');
  var inputEl       = document.getElementById('newItem');
  var barEl         = document.getElementById('bar');
  var ptextEl       = document.getElementById('ptext');
  var suggestBody   = document.getElementById('suggestBody');
  var suggestReason = document.getElementById('suggestReason');
  var suggestCard   = document.getElementById('suggestCard');
  var pickSubject   = document.getElementById('pickSubject');
  var clearDoneBtn  = document.getElementById('clearDone');
  var resetAllBtn   = document.getElementById('resetAll');
  var modeGroupBtn  = document.getElementById('modeGroup');
  var modeRandomBtn = document.getElementById('modeRandom');
  var dateLabel     = document.getElementById('dateLabel');

  /* ---------- 液态玻璃实例 ---------- */
  var lg = null;

  function liquidGlassify(root) {
    if (!lg) return;

    var scope = root || document;

    // 大按钮
    scope.querySelectorAll('.btn').forEach(function (el) {
      if (el.dataset.liquidGlass === 'on') return;
      lg.apply(el, {
        radius: 11,
        strength: 15,
        edgeWidth: 10,
        blur: 0.4,
        saturate: 1.8,
        brightness: 1.05
      });
    });

    // 小胶囊
    scope.querySelectorAll('.mode-btn').forEach(function (el) {
      if (el.dataset.liquidGlass === 'on') return;
      lg.apply(el, {
        radius: 15,
        strength: 10,
        edgeWidth: 6,
        blur: 0.3,
        saturate: 1.6,
        brightness: 1.04
      });
    });

    // 恢复按钮
    scope.querySelectorAll('.restore').forEach(function (el) {
      if (el.dataset.liquidGlass === 'on') return;
      lg.apply(el, {
        radius: 8,
        strength: 8,
        edgeWidth: 5,
        blur: 0.3,
        saturate: 1.5,
        brightness: 1.03
      });
    });
  }

  /* ---------- 工具 ---------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function buzz(ms) {
    if (navigator.vibrate) {
      try { navigator.vibrate(ms); } catch (e) {}
    }
  }

  function hexToRgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function colorOf(subject) {
    return COLORS[subject] || '#8E8880';
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  var pulseTimer = null;
  function pulseSuggest() {
    if (!suggestCard) return;
    suggestCard.classList.remove('pulse');
    void suggestCard.offsetWidth;
    suggestCard.classList.add('pulse');
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(function () {
      suggestCard.classList.remove('pulse');
    }, 820);
  }

  /* ================= 推荐逻辑 ================= */
  function pickableSubjects() {
    var seen = [];
    items.forEach(function (it) {
      if (!it.done && !it.skipped && it.subject && seen.indexOf(it.subject) === -1) {
        seen.push(it.subject);
      }
    });
    return seen;
  }

  function suggest() {
    var undone = items.filter(function (it) { return !it.done && !it.skipped; });

    clear(suggestBody);
    suggestReason.textContent = '';

    if (!undone.length) {
      var skipped = items.filter(function (it) { return it.skipped; });
      var emptyEl = document.createElement('div');
      emptyEl.className = 'suggest-empty';

      if (skipped.length) {
        emptyEl.textContent = '待做的都处理完啦，还有 ' + skipped.length + ' 项被跳过';
        suggestBody.appendChild(emptyEl);

        var restoreAll = document.createElement('button');
        restoreAll.type = 'button';
        restoreAll.className = 'btn btn-primary';
        restoreAll.textContent = '恢复全部跳过';
        restoreAll.style.width = '100%';
        restoreAll.addEventListener('click', function () {
          items.forEach(function (it) { if (it.skipped) it.skipped = false; });
          save(); render();
        });
        suggestBody.appendChild(restoreAll);
      } else {
        emptyEl.textContent = '全部写完啦，去休息一会儿吧';
        suggestBody.appendChild(emptyEl);
      }
      liquidGlassify(suggestBody);
      return;
    }

    var target = null;
    var reason = '';

    if (pick) {
      var pu = undone.filter(function (it) { return it.subject === pick; });
      if (pu.length) {
        target = pu[0];
        reason = '指定科目「' + pick + '」';
      } else {
        suggestBody.innerHTML =
          '<div class="suggest-empty">「' + pick + '」已经写完啦</div>';
        return;
      }
    } else if (mode === 'group') {
      var lastUndone = null;
      var lu = [];
      if (lastSubject) {
        lu = undone.filter(function (it) { return it.subject === lastSubject; });
        if (lu.length) lastUndone = lu[0];
      }
      if (lastUndone) {
        target = lastUndone;
        reason = '接着写「' + lastSubject + '」，还剩 ' + lu.length + ' 项';
      } else {
        var counts = {};
        undone.forEach(function (it) {
          if (it.subject) counts[it.subject] = (counts[it.subject] || 0) + 1;
        });
        var keys = Object.keys(counts);
        if (keys.length) {
          keys.sort(function (a, b) { return counts[b] - counts[a]; });
          target = undone.filter(function (it) { return it.subject === keys[0]; })[0];
          reason = '开始写「' + keys[0] + '」，共 ' + counts[keys[0]] + ' 项';
        } else {
          target = undone[0];
          reason = '按顺序来';
        }
      }
    } else {
      var subs = pickableSubjects();
      if (subs.length) {
        var s = subs[Math.floor(Math.random() * subs.length)];
        target = undone.filter(function (it) { return it.subject === s; })[0];
        reason = '随机抽到「' + s + '」';
      } else {
        target = undone[Math.floor(Math.random() * undone.length)];
        reason = '随机挑一项';
      }
    }

    var idx = items.indexOf(target);
    suggestReason.textContent = reason;

    var taskRow = document.createElement('div');
    taskRow.className = 'suggest-task';

    if (target.subject) {
      var c = colorOf(target.subject);
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = target.subject;
      tag.style.color = c;
      tag.style.background = hexToRgba(c, 0.13);
      taskRow.appendChild(tag);
    }

    var txt = document.createElement('span');
    txt.className = 'suggest-text';
    txt.textContent = target.text;
    taskRow.appendChild(txt);

    suggestBody.appendChild(taskRow);

    var actions = document.createElement('div');
    actions.className = 'suggest-actions';

    var doBtn = document.createElement('button');
    doBtn.type = 'button';
    doBtn.className = 'btn btn-primary';
    doBtn.textContent = '完成';
    doBtn.addEventListener('click', function () {
      items[idx].done = true;
      items[idx].skipped = false;
      if (target.subject) {
        lastSubject = target.subject;
        try { localStorage.setItem(KEY + '-last', lastSubject); } catch (e) {}
      }
      buzz(12);
      pulseSuggest();
      save(); render();
    });

    var skipBtn = document.createElement('button');
    skipBtn.type = 'button';
    skipBtn.className = 'btn btn-ghost';
    skipBtn.textContent = '跳过';
    skipBtn.addEventListener('click', function () {
      items[idx].skipped = true;
      items[idx].done = false;
      pulseSuggest();
      save(); render();
    });

    actions.appendChild(doBtn);
    actions.appendChild(skipBtn);
    suggestBody.appendChild(actions);

    // 新增按钮也要上玻璃
    liquidGlassify(suggestBody);
  }

  /* ================= 科目下拉 ================= */
  function refreshSubjects() {
    var subs = pickableSubjects();
    var cur = pickSubject.value;

    clear(pickSubject);

    var auto = document.createElement('option');
    auto.value = '';
    auto.textContent = '自动';
    pickSubject.appendChild(auto);

    subs.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s;
      o.textContent = s;
      pickSubject.appendChild(o);
    });

    if (subs.indexOf(cur) !== -1) {
      pickSubject.value = cur;
    } else {
      pick = '';
      pickSubject.value = '';
    }
  }

  /* ================= 模式 ================= */
  function setMode(m) {
    mode = m;
    pick = '';
    pickSubject.value = '';

    modeGroupBtn.classList.toggle('active', m === 'group');
    modeRandomBtn.classList.toggle('active', m === 'random');

    try { localStorage.setItem(KEY + '-mode', m); } catch (e) {}

    refreshSubjects();
    suggest();
  }

  modeGroupBtn.addEventListener('click', function () { setMode('group'); });
  modeRandomBtn.addEventListener('click', function () { setMode('random'); });

  pickSubject.addEventListener('change', function () {
    pick = pickSubject.value;
    if (pick) {
      mode = 'group';
      modeGroupBtn.classList.add('active');
      modeRandomBtn.classList.remove('active');
    }
    suggest();
  });

  /* ================= 渲染 ================= */
  function buildItem(item) {
    var li = document.createElement('li');
    li.className = 'item';
    if (item.done) li.classList.add('done');
    else if (item.skipped) li.classList.add('skipped');

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('tabindex', '0');
    check.setAttribute('aria-checked', item.done ? 'true' : 'false');
    check.setAttribute('aria-label', '标记完成');
    check.innerHTML = CHECK_SVG;

    check.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleDone(item);
    });
    check.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggleDone(item);
      }
    });

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text;
    text.addEventListener('click', function () { toggleDone(item); });

    li.appendChild(check);
    li.appendChild(text);

    if (item.skipped) {
      var rs = document.createElement('button');
      rs.type = 'button';
      rs.className = 'restore';
      rs.textContent = '恢复';
      rs.setAttribute('aria-label', '恢复这项作业');
      rs.addEventListener('click', function (e) {
        e.stopPropagation();
        item.skipped = false;
        save(); render();
      });
      li.appendChild(rs);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.innerHTML = X_SVG;
    del.setAttribute('aria-label', '删除');
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      var i = items.indexOf(item);
      if (i === -1) return;
      items.splice(i, 1);
      save(); render();
    });
    li.appendChild(del);

    return li;
  }

  function render() {
    clear(listEl);

    var done = 0;
    var skippedCount = 0;

    var groups = {};
    items.forEach(function (item) {
      var s = item.subject || '其他';
      if (!groups[s]) groups[s] = [];
      groups[s].push(item);
      if (item.done) done++;
      if (item.skipped) skippedCount++;
    });

    function renderGroup(sub) {
      var arr = groups[sub];
      if (!arr || !arr.length) return;

      arr = arr.slice().sort(function (a, b) {
        return (a.skipped ? 1 : 0) - (b.skipped ? 1 : 0);
      });

      var title = document.createElement('div');
      title.className = 'group-title';
      var dot = document.createElement('span');
      dot.className = 'group-dot';
      dot.style.background = colorOf(sub);
      title.appendChild(dot);
      title.appendChild(document.createTextNode(sub));
      listEl.appendChild(title);

      arr.forEach(function (item) {
        listEl.appendChild(buildItem(item));
      });
    }

    SUBJECT_ORDER.forEach(renderGroup);
    renderGroup('其他');

    if (!items.length) {
      var emptyBox = document.createElement('div');
      emptyBox.className = 'empty';

      var mark = document.createElement('div');
      mark.className = 'empty-mark';
      mark.textContent = '☁︎';

      var main = document.createElement('div');
      main.className = 'empty-main';
      main.textContent = '还没有作业';

      var sub = document.createElement('div');
      sub.className = 'empty-sub';
      sub.textContent = '在下面添加第一条吧';

      emptyBox.appendChild(mark);
      emptyBox.appendChild(main);
      emptyBox.appendChild(sub);
      listEl.appendChild(emptyBox);
    }

    var pct = items.length ? Math.round((done / items.length) * 100) : 0;
    barEl.style.width = pct + '%';

    if (!items.length) {
      ptextEl.textContent = '';
    } else {
      ptextEl.textContent = '已完成 ' + done + ' / ' + items.length +
        (skippedCount ? ' · 跳过 ' + skippedCount : '');
    }

    clearDoneBtn.disabled = !done;
    resetAllBtn.disabled = !items.length;

    refreshSubjects();
    suggest();

    // 新增元素上玻璃
    liquidGlassify();
  }

  /* ================= 交互 ================= */
  function toggleDone(item) {
    var i = items.indexOf(item);
    if (i === -1) return;

    items[i].done = !items[i].done;

    if (items[i].done) {
      items[i].skipped = false;
      if (items[i].subject) {
        lastSubject = items[i].subject;
        try { localStorage.setItem(KEY + '-last', lastSubject); } catch (e) {}
      }
      buzz(12);
    }

    save();
    render();
  }

  function add() {
    var v = inputEl.value.trim();
    if (!v) return;

    var subject = document.getElementById('newSubject').value || '';

    items.push({
      id: ++uid,
      text: v,
      subject: subject,
      done: false,
      skipped: false
    });

    inputEl.value = '';
    document.getElementById('newSubject').value = '';

    save();
    render();
    inputEl.focus();
  }

  document.getElementById('addBtn').addEventListener('click', add);

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') add();
  });

  /* ================= 两步确认 ================= */
  function twoStep(btn, fn) {
    var orig = btn.textContent;
    var armed = false;
    var timer = null;

    function disarm() {
      armed = false;
      btn.textContent = orig;
      btn.classList.remove('armed');
      clearTimeout(timer);
    }

    btn.addEventListener('click', function () {
      if (btn.disabled) return;

      if (armed) {
        disarm();
        fn();
        return;
      }

      armed = true;
      btn.textContent = '再点一次';
      btn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
    });
  }

  twoStep(clearDoneBtn, function () {
    items = items.filter(function (it) { return !it.done; });
    save();
    render();
  });

  twoStep(resetAllBtn, function () {
    items.forEach(function (it) {
      it.done = false;
      it.skipped = false;
    });
    save();
    render();
  });

  /* ================= 启动 ================= */
  function init() {
    // 初始化液态玻璃引擎
    lg = new LiquidGlass();

    // 先给静态按钮上玻璃
    requestAnimationFrame(function () {
      liquidGlassify(document);
    });

    // 加载数据
    fetch('data/latest.json?v=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (d) {
        KEY = d.key || 'hw-list';
        PHOTO = d.photo || '';

        if (d.label) dateLabel.textContent = d.label;

        try {
          items = JSON.parse(localStorage.getItem(KEY)) || null;
        } catch (e) {
          items = null;
        }

        if (!items) {
          items = d.items || [];
          save();
        }

        items.forEach(function (it) {
          if (!it.id) it.id = ++uid;
          else uid = Math.max(uid, it.id);
        });

        lastSubject = localStorage.getItem(KEY + '-last') || '';

        var savedMode = localStorage.getItem(KEY + '-mode');
        mode = (savedMode === 'random') ? 'random' : 'group';
        modeGroupBtn.classList.toggle('active', mode === 'group');
        modeRandomBtn.classList.toggle('active', mode === 'random');

        if (PHOTO) {
          document.getElementById('photoImg').src = PHOTO;
          document.getElementById('photoLink').href = PHOTO;
          document.getElementById('photoCard').style.display = 'block';
        }

        render();

        // 渲染完毕，再次上玻璃（覆盖动态生成的按钮）
        requestAnimationFrame(function () {
          liquidGlassify(document);
        });
      })
      .catch(function () {
        ptextEl.textContent = '暂时拉不到作业数据，刷新试试';
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
