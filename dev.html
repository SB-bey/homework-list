<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>作业清单 · 10月3日</title>
<style>
:root {
  --bg: #000;
  --text: #f5f5f7;
  --secondary: rgba(235,235,245,.68);
  --tertiary: rgba(235,235,245,.42);
  --green: #30d158;
  --blue: #0a84ff;
  --red: #ff453a;
  --orange: #ff9f0a;
  --glass: rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.115);
  --glass-border: rgba(255,255,255,.16);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  background: #000;
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  padding:
    max(18px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(35px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
  overflow-x: hidden;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(650px 500px at var(--bg-x, 15%) var(--bg-y, 0%), rgba(10,132,255,.20), transparent 70%),
    radial-gradient(650px 500px at 100% 20%, rgba(48,209,88,.12), transparent 72%),
    radial-gradient(700px 600px at 40% 110%, rgba(175,82,222,.13), transparent 72%),
    #000;
}

/* ========================= 动态背景光 ========================= */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(70px);
  z-index: -1;
  opacity: .45;
  transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
}
body::before {
  background: rgba(10,132,255,.18);
  left: 0;
  top: 5%;
  transform: translate(var(--light-x, 0px), var(--light-y, 0px));
}
body::after {
  background: rgba(48,209,88,.13);
  right: -100px;
  bottom: 5%;
  transform: translate(calc(var(--light-x, 0px) * -.35), calc(var(--light-y, 0px) * -.35));
}

/* ========================= 主玻璃容器 ========================= */
.card {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  padding: clamp(20px, 5vw, 32px);
  overflow: hidden;
  border-radius: 32px;
  background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.045));
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(38px) saturate(180%);
  -webkit-backdrop-filter: blur(38px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(255,255,255,.035),
    0 35px 100px rgba(0,0,0,.55),
    0 4px 25px rgba(0,0,0,.35);
  transform: translateZ(0);
}
/* 顶部真实感高光 */
.card::before {
  content: "";
  position: absolute;
  left: 5%;
  right: 5%;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
  opacity: .75;
  pointer-events: none;
}
/* 鼠标/手指附近的玻璃反光 */
.card::after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  left: var(--mx, 50%);
  top: var(--my, 0);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.075), transparent 65%);
  pointer-events: none;
  mix-blend-mode: screen;
  transition: left .35s ease, top .35s ease;
}

/* ========================= Header ========================= */
.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 14px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.header h1 {
  font-size: clamp(22px, 6vw, 29px);
  font-weight: 700;
  letter-spacing: -.75px;
  line-height: 1.2;
}
.date {
  margin-left: auto;
  color: var(--secondary);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.sub {
  margin-bottom: 18px;
  color: var(--secondary);
  font-size: 13px;
}

/* ========================= Progress ========================= */
.progress-wrap {
  height: 7px;
  margin-bottom: 9px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,.065);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
}
.progress-bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #30d158, #63e879);
  box-shadow: 0 0 18px rgba(48,209,88,.4);
  transition: width .45s cubic-bezier(.22,.61,.36,1);
}
.progress-text {
  margin-bottom: 20px;
  color: var(--secondary);
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* ========================= List ========================= */
ul {
  list-style: none;
}
li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 5px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  font-size: 16px;
  animation: itemIn .28s cubic-bezier(.22,.61,.36,1);
}
li:last-child {
  border-bottom: none;
}
@keyframes itemIn {
  from { opacity: 0; transform: translateY(-5px) scale(.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ========================= Apple Check ========================= */
.check {
  width: 25px;
  height: 25px;
  flex-shrink: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.055);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  cursor: pointer;
  transition:
    transform .25s cubic-bezier(.22,.61,.36,1),
    background .25s ease,
    border .25s ease,
    box-shadow .25s ease;
}
.check::before {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  border-top: 1px solid rgba(255,255,255,.18);
  pointer-events: none;
}
.check svg {
  width: 14px;
  height: 14px;
  opacity: 0;
  transform: scale(.55);
  transition: .22s cubic-bezier(.22,.61,.36,1);
}
li.done .check {
  background: linear-gradient(145deg, #63e879, #30d158);
  border-color: rgba(255,255,255,.32);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.45),
    0 0 18px rgba(48,209,88,.25);
}
li.done .check svg {
  opacity: 1;
  transform: scale(1);
}

/* ========================= Text ========================= */
.text {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  line-height: 1.5;
  word-break: break-word;
  overflow-wrap: anywhere;
  transition: opacity .2s ease, color .2s ease;
}
li.done .text {
  color: rgba(235,235,245,.37);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
}
li.skipped .text {
  opacity: .4;
  font-style: italic;
  text-decoration: line-through dotted rgba(255,255,255,.3);
}

/* ========================= Delete ========================= */
.del {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: rgba(235,235,245,.4);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .2s ease;
}

/* ========================= Subject ========================= */
.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px dashed rgba(255,255,255,.11);
  color: rgba(245,245,247,.78);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .6px;
}
.group-title:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}
.group-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 10px currentColor;
}

/* ========================= Glass Cards ========================= */
.suggest-card,
.photo-card {
  position: relative;
  overflow: hidden;
  border-radius: 23px;
  border: 1px solid rgba(255,255,255,.14);
  background: linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
  backdrop-filter: blur(30px) saturate(175%);
  -webkit-backdrop-filter: blur(30px) saturate(175%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 15px 45px rgba(0,0,0,.2);
}
.suggest-card {
  padding: 15px;
  margin-bottom: 18px;
}
.photo-card {
  padding: 12px;
  margin-bottom: 18px;
}
.suggest-head,
.photo-head {
  margin-bottom: 10px;
  color: rgba(245,245,247,.72);
  font-size: 13px;
  font-weight: 700;
}

/* ========================= Suggest ========================= */
.suggest-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 13px;
  margin-bottom: 12px;
  min-height: 32px;
  border-radius: 17px;
  background: rgba(0,0,0,.15);
  border: 1px solid rgba(255,255,255,.07);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.suggest-text {
  grid-column: 1 / -1;
  min-width: 0;
  line-height: 1.55;
  word-break: break-word;
}
.suggest-empty {
  grid-column: 1 / -1;
  color: var(--tertiary);
  font-size: 14px;
}

/* ========================= Tag ========================= */
.tag {
  display: inline-flex;
  justify-self: start;
  padding: 3px 10px;
  border-radius: 999px;
  color: white;
  font-size: 12px;
  font-weight: 600;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.28),
    0 4px 14px rgba(0,0,0,.18);
}

/* ========================= Buttons ========================= */
.do-btn,
.skip-btn,
.restore,
.mode-btn,
.actions button,
.add-row button {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  cursor: pointer;
  font-family: inherit;
  transition:
    transform .25s cubic-bezier(.22,.61,.36,1),
    box-shadow .25s ease,
    background .25s ease,
    border .25s ease;
}
/* 光泽 */
.do-btn::before,
.skip-btn::before,
.restore::before,
.mode-btn::before,
.actions button::before,
.add-row button::before {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  pointer-events: none;
}
/* Primary */
.do-btn,
.add-row button {
  min-height: 44px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 999px;
  background: linear-gradient(145deg, rgba(99,232,121,.92), rgba(48,209,88,.72));
  color: white;
  font-size: 14px;
  font-weight: 600;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.42),
    0 7px 25px rgba(48,209,88,.18);
}
/* Secondary */
.skip-btn {
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  color: rgba(245,245,247,.72);
  font-size: 14px;
}
/* Restore */
.restore {
  height: 34px;
  padding: 0 14px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  color: rgba(245,245,247,.65);
  font-size: 13px;
}

/* ========================= Mode ========================= */
.suggest-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.mode-label {
  color: var(--tertiary);
  font-size: 12px;
}
.mode-btn {
  min-height: 36px;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  color: rgba(245,245,247,.6);
  font-size: 13px;
}
.mode-btn.active {
  color: white;
  background: rgba(255,255,255,.16);
  border-color: rgba(255,255,255,.25);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.2);
}

/* ========================= Select ========================= */
select {
  appearance: none;
  -webkit-appearance: none;
  font-family: inherit;
  outline: none;
  color: rgba(245,245,247,.8);
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.suggest-controls select {
  min-height: 36px;
  max-width: 100%;
  padding: 0 13px;
  border-radius: 999px;
  font-size: 13px;
}

/* ========================= Photo ========================= */
.photo-card img {
  width: 100%;
  max-height: 70vh;
  display: block;
  object-fit: contain;
  border-radius: 16px;
  background: rgba(0,0,0,.25);
}

/* ========================= Add ========================= */
.add-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.add-row input {
  flex: 1;
  min-width: 0;
  height: 47px;
  padding: 0 16px;
  outline: none;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  transition: .2s ease;
}
.add-row input::placeholder {
  color: rgba(235,235,245,.34);
}
.add-row input:focus {
  border-color: rgba(48,209,88,.45);
  background: rgba(255,255,255,.085);
  box-shadow: 0 0 0 3px rgba(48,209,88,.08);
}
.add-row select {
  height: 47px;
  max-width: 105px;
  padding: 0 13px;
  border-radius: 999px;
  font-size: 14px;
}
.add-row button {
  height: 47px;
  padding: 0 21px;
}

/* ========================= Actions ========================= */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.actions button {
  flex: 1;
  min-height: 44px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 999px;
  background: rgba(255,255,255,.05);
  color: rgba(245,245,247,.63);
  font-family: inherit;
  font-size: 14px;
}
.actions button:disabled {
  opacity: .3;
  cursor: not-allowed;
}
.actions button.armed {
  color: #ff453a;
  border-color: rgba(255,69,58,.4);
  background: rgba(255,69,58,.08);
}

/* ========================= Hover ========================= */
@media (hover: hover) {
  .do-btn:hover,
  .add-row button:hover {
    transform: translateY(-1px) scale(1.015);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.5),
      0 12px 32px rgba(48,209,88,.2);
  }
  .skip-btn:hover,
  .restore:hover,
  .mode-btn:hover,
  .actions button:hover:not(:disabled) {
    transform: translateY(-1px);
    background: rgba(255,255,255,.105);
    border-color: rgba(255,255,255,.23);
  }
  .del:hover {
    color: var(--red);
    background: rgba(255,69,58,.1);
    transform: scale(1.06);
  }
  .check:hover {
    transform: scale(1.07);
    border-color: rgba(48,209,88,.55);
  }
}

/* ========================= Touch / Active ========================= */
.do-btn:active,
.skip-btn:active,
.restore:active,
.mode-btn:active,
.actions button:active,
.add-row button:active {
  transform: scale(.94);
  transition-duration: .08s;
}
.check:active {
  transform: scale(.88);
}

/* ========================= Focus ========================= */
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid rgba(99,232,121,.75);
  outline-offset: 3px;
}

/* ========================= Responsive ========================= */
@media (min-width: 600px) {
  body {
    padding-top: max(32px, env(safe-area-inset-top));
  }
  .suggest-body {
    grid-template-columns: 1fr auto auto;
  }
  .suggest-text {
    grid-column: 1;
  }
}
@media (max-width: 479px) {
  .add-row {
    flex-wrap: wrap;
  }
  .add-row input {
    flex: 1 1 100%;
  }
  .add-row select {
    flex: 1;
    max-width: none;
  }
  .add-row button {
    flex: 1;
  }
}
@media (max-width: 360px) {
  .card {
    border-radius: 27px;
  }
  li {
    gap: 10px;
  }
}

/* ========================= Reduce Motion ========================= */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>📋 作业清单</h1>
    <div class="date">10月3日 周六 · 国庆假期</div>
  </div>
  <div class="sub">点条目或方块即可划掉，进度自动保存</div>

  <div class="progress-wrap">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="progress-text" id="ptext"></div>

  <!-- 推荐卡片 -->
  <div class="suggest-card">
    <div class="suggest-head" id="suggestHead">🎯 下一个建议写</div>
    <div class="suggest-body" id="suggestBody"></div>
    <div class="suggest-controls">
      <span class="mode-label">模式</span>
      <button type="button" class="mode-btn active" id="modeGroup">同科优先</button>
      <button type="button" class="mode-btn" id="modeRandom">随机</button>
      <span class="mode-label">指定科目</span>
      <select id="pickSubject">
        <option value="">自动</option>
      </select>
    </div>
  </div>

  <!-- 作业原图 -->
  <div class="photo-card" id="photoCard" style="display:none">
    <div class="photo-head">📷 作业原图 · 看不清点开看大图</div>
    <a id="photoLink" href="#" target="_blank" rel="noopener">
      <img id="photoImg" alt="作业原图">
    </a>
  </div>

  <!-- 列表 -->
  <ul id="list"></ul>

  <!-- 添加栏 -->
  <div class="add-row">
    <input id="newItem" type="text" placeholder="添加一条作业…" autocomplete="off">
    <select id="newSubject">
      <option value="">科目</option>
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="历史">历史</option>
      <option value="政治">政治</option>
      <option value="化学">化学</option>
      <option value="物理">物理</option>
    </select>
    <button type="button" id="addBtn">添加</button>
  </div>

  <!-- 批量操作 -->
  <div class="actions">
    <button type="button" id="clearDone">清除已完成</button>
    <button type="button" id="resetAll">重置全部</button>
  </div>

  <div class="hint">推荐不喜欢？点「跳过它」换一个，跳过的条目可以「恢复」</div>
</div>

<!-- ================= 玻璃跟随光效 ================= -->
<script>
(function () {
  function updateGlass(e) {
    var x = e.clientX;
    var y = e.clientY;

    document.documentElement.style.setProperty(
      '--light-x',
      (x / window.innerWidth * 100) + '%'
    );
    document.documentElement.style.setProperty(
      '--light-y',
      (y / window.innerHeight * 100) + '%'
    );
    document.documentElement.style.setProperty('--mx', x + 'px');
    document.documentElement.style.setProperty('--my', y + 'px');
  }

  window.addEventListener('pointermove', updateGlass, { passive: true });
})();
</script>

<!-- ================= 主逻辑（原样保留） ================= -->
<script>
(function(){
  var KEY = '';
  var PHOTO = '';   // 当天作业原图，没有照片就留空 ''

  var COLORS = {
    '历史': '#9a7bd6',
    '化学': '#4aa3a3',
    '语文': '#c2579a',
    '英语': '#3fa86b',
    '政治': '#d0566e',
    '数学': '#4a7bd6',
    '物理': '#e08a3c'
  };
  var SUBJECT_ORDER = ['语文','数学','英语','历史','政治','化学','物理'];

  var items = [];
  var mode = 'group';   // 'group' 同科优先 | 'random' 随机
  var pick = '';        // '' 自动 | 科目名
  var lastSubject = ''; // 记住正在写的科目

  var list = document.getElementById('list');
  var input = document.getElementById('newItem');
  var bar = document.getElementById('bar');
  var ptext = document.getElementById('ptext');
  var suggestBody = document.getElementById('suggestBody');
  var suggestHead = document.getElementById('suggestHead');
  var pickSubject = document.getElementById('pickSubject');
  var clearDoneBtn = document.getElementById('clearDone');
  var resetAllBtn = document.getElementById('resetAll');
  var modeGroupBtn = document.getElementById('modeGroup');
  var modeRandomBtn = document.getElementById('modeRandom');

  function save(){
    localStorage.setItem(KEY, JSON.stringify(items));
  }
  function buzz(ms){
    if(navigator.vibrate){ try { navigator.vibrate(ms); } catch(e){} }
  }

  /* ---------------- 推荐逻辑 ---------------- */
  function pickableSubjects(){
    var subs = [];
    items.forEach(function(it){
      if(!it.done && !it.skipped && it.subject && subs.indexOf(it.subject) === -1) subs.push(it.subject);
    });
    return subs;
  }

  function suggest(){
    var undone = items.filter(function(it){ return !it.done && !it.skipped; });
    suggestHead.textContent = '🎯 下一个建议写';
    suggestBody.innerHTML = '';

    if(!undone.length){
      var skipped = items.filter(function(it){ return it.skipped; });
      var empty = document.createElement('span');
      empty.className = 'suggest-empty';
      if(skipped.length){
        empty.textContent = '待做的都处理完啦，还有 ' + skipped.length + ' 项被跳过';
        suggestBody.appendChild(empty);
        var rb = document.createElement('button');
        rb.type = 'button';
        rb.className = 'do-btn';
        rb.textContent = '恢复全部跳过 (' + skipped.length + ')';
        rb.addEventListener('click', function(){
          items.forEach(function(it){ if(it.skipped) it.skipped = false; });
          save(); render();
        });
        suggestBody.appendChild(rb);
      } else {
        empty.textContent = '🎉 全部写完啦，可以休息了！';
        suggestBody.appendChild(empty);
      }
      return;
    }

    var target = null, reason = '';

    if(pick){
      var pu = undone.filter(function(it){ return it.subject === pick; });
      if(pu.length){
        target = pu[0];
        reason = '指定科目「' + pick + '」';
      } else {
        suggestBody.innerHTML = '<span class="suggest-empty">「' + pick + '」已经写完啦 ✅</span>';
        return;
      }
    } else if(mode === 'group'){
      // 先接着写正在写的科目（同科集中写完），写完再换剩余最多的科目
      var lastUndone = null, lu = [];
      if(lastSubject){
        lu = undone.filter(function(it){ return it.subject === lastSubject; });
        if(lu.length) lastUndone = lu[0];
      }
      if(lastUndone){
        target = lastUndone;
        reason = '接着写「' + lastSubject + '」，还剩 ' + lu.length + ' 项';
      } else {
        var counts = {};
        undone.forEach(function(it){
          if(it.subject) counts[it.subject] = (counts[it.subject]||0) + 1;
        });
        var keys = Object.keys(counts);
        if(keys.length){
          keys.sort(function(a,b){ return counts[b] - counts[a]; });
          target = undone.filter(function(it){ return it.subject === keys[0]; })[0];
          reason = '开始写「' + keys[0] + '」，共 ' + counts[keys[0]] + ' 项';
        } else {
          target = undone[0];
          reason = '按顺序来';
        }
      }
    } else {
      var subs = pickableSubjects();
      if(subs.length){
        var s = subs[Math.floor(Math.random()*subs.length)];
        target = undone.filter(function(it){ return it.subject === s; })[0];
        reason = '随机抽到「' + s + '」';
      } else {
        target = undone[Math.floor(Math.random()*undone.length)];
        reason = '随机挑一项';
      }
    }

    var idx = items.indexOf(target);
    suggestHead.textContent = '🎯 下一个建议写 · ' + reason;

    if(target.subject){
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = COLORS[target.subject] || '#999';
      tag.textContent = target.subject;
      suggestBody.appendChild(tag);
    }

    var txt = document.createElement('span');
    txt.className = 'suggest-text';
    txt.textContent = target.text;
    suggestBody.appendChild(txt);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'do-btn';
    btn.textContent = '完成它 ✓';
    btn.addEventListener('click', function(){
      items[idx].done = true;
      items[idx].skipped = false;
      if(target.subject){
        lastSubject = target.subject;
        localStorage.setItem(KEY + '-last', lastSubject);
      }
      buzz(15);
      save(); render();
    });
    suggestBody.appendChild(btn);

    var skbtn = document.createElement('button');
    skbtn.type = 'button';
    skbtn.className = 'skip-btn';
    skbtn.textContent = '跳过它 ⏭';
    skbtn.setAttribute('aria-label','暂时跳过这项推荐');
    skbtn.addEventListener('click', function(){
      items[idx].skipped = true;
      items[idx].done = false;
      save(); render();
    });
    suggestBody.appendChild(skbtn);
  }

  /* ---------------- 科目下拉 ---------------- */
  function refreshSubjects(){
    var subs = pickableSubjects();
    var cur = pickSubject.value;
    pickSubject.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = '';
    opt0.textContent = '自动';
    pickSubject.appendChild(opt0);
    subs.forEach(function(s){
      var o = document.createElement('option');
      o.value = s;
      o.textContent = s;
      pickSubject.appendChild(o);
    });
    if(subs.indexOf(cur) !== -1) pickSubject.value = cur;
    else { pick = ''; pickSubject.value = ''; }
  }

  /* ---------------- 模式切换 ---------------- */
  function setMode(m){
    mode = m;
    pick = '';
    pickSubject.value = '';
    modeGroupBtn.classList.toggle('active', m === 'group');
    modeRandomBtn.classList.toggle('active', m === 'random');
    if(KEY) localStorage.setItem(KEY + '-mode', m);
    refreshSubjects();
    suggest();
  }
  modeGroupBtn.addEventListener('click', function(){ setMode('group'); });
  modeRandomBtn.addEventListener('click', function(){ setMode('random'); });
  pickSubject.addEventListener('change', function(){
    pick = pickSubject.value;
    if(pick) setMode('group') , (pick = pickSubject.value) , (pickSubject.value = pick);
    suggest();
  });

  /* ---------------- 渲染 ---------------- */
  function buildItem(item){
    var li = document.createElement('li');
    if(item.done) li.className = 'done';
    else if(item.skipped) li.className = 'skipped';

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('role','checkbox');
    check.setAttribute('tabindex','0');
    check.setAttribute('aria-checked', item.done ? 'true' : 'false');
    check.setAttribute('aria-label','完成');
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>';
    check.addEventListener('click', function(){ toggleDone(item); });
    check.addEventListener('keydown', function(e){
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggleDone(item); }
    });

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text;
    text.addEventListener('click', function(){ toggleDone(item); });

    li.appendChild(check);
    li.appendChild(text);

    if(item.skipped){
      var rs = document.createElement('button');
      rs.type = 'button';
      rs.className = 'restore';
      rs.textContent = '恢复';
      rs.setAttribute('aria-label','恢复这项作业');
      rs.addEventListener('click', function(){
        item.skipped = false;
        save(); render();
      });
      li.appendChild(rs);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.innerHTML = '×';
    del.setAttribute('aria-label','删除');
    del.addEventListener('click', function(){
      var i = items.indexOf(item);
      if(i === -1) return;
      items.splice(i, 1);
      save(); render();
    });
    li.appendChild(del);

    return li;
  }

  function render(){
    list.innerHTML = '';
    var done = 0, skipped = 0;

    // 按科目分组：同科作业聚在一起，顺序固定 语数英史政化+物理，最后"其他"
    var groups = {};
    items.forEach(function(item){
      var s = item.subject || '其他';
      if(!groups[s]) groups[s] = [];
      groups[s].push(item);
      if(item.done) done++;
      if(item.skipped) skipped++;
    });

    function renderGroup(sub){
      var arr = groups[sub];
      if(!arr || !arr.length) return;
      arr = arr.slice().sort(function(a,b){
        return (a.skipped?1:0) - (b.skipped?1:0);
      });
      var title = document.createElement('div');
      title.className = 'group-title';
      var dot = document.createElement('span');
      dot.className = 'group-dot';
      dot.style.background = COLORS[sub] || '#6b7686';
      title.appendChild(dot);
      title.appendChild(document.createTextNode(sub));
      list.appendChild(title);
      arr.forEach(function(item){ list.appendChild(buildItem(item)); });
    }

    SUBJECT_ORDER.forEach(renderGroup);
    renderGroup('其他');

    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    bar.style.width = pct + '%';
    if(!items.length){
      ptext.textContent = '还没有作业，下面添加一条吧';
    } else {
      ptext.textContent = '已完成 ' + done + ' / ' + items.length + ' 项' + (skipped ? ' · 跳过 ' + skipped : '');
    }
    clearDoneBtn.disabled = !done;
    resetAllBtn.disabled = !items.length;

    refreshSubjects();
    suggest();
  }

  /* ---------------- 交互 ---------------- */
  function toggleDone(item){
    var i = items.indexOf(item);
    if(i === -1) return;
    items[i].done = !items[i].done;
    if(items[i].done){
      items[i].skipped = false;
      if(items[i].subject){
        lastSubject = items[i].subject;
        localStorage.setItem(KEY + '-last', lastSubject);
      }
      buzz(15);
    }
    save(); render();
  }

  function add(){
    var v = input.value.trim();
    if(!v) return;
    var subject = document.getElementById('newSubject').value || '';
    items.push({ text: v, subject: subject, done: false, skipped: false });
    input.value = '';
    document.getElementById('newSubject').value = '';
    save(); render();
    input.focus();
  }
  document.getElementById('addBtn').addEventListener('click', add);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') add();
  });

  /* ---------------- 批量操作（两步确认） ---------------- */
  function twoStep(btn, fn){
    var orig = btn.textContent, armed = false, timer = null;
    function disarm(){
      armed = false;
      btn.textContent = orig;
      btn.classList.remove('armed');
      clearTimeout(timer);
    }
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      if(armed){ disarm(); fn(); return; }
      armed = true;
      btn.textContent = '再点一次确认';
      btn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
    });
  }
  twoStep(clearDoneBtn, function(){
    items = items.filter(function(it){ return !it.done; });
    save(); render();
  });
  twoStep(resetAllBtn, function(){
    items.forEach(function(it){ it.done = false; it.skipped = false; });
    save(); render();
  });

  /* ---------------- 数据加载 ---------------- */
  fetch('data/latest.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      KEY = d.key || 'hw-list';
      PHOTO = d.photo || '';
      document.querySelector('.date').textContent = d.label || '';

      try { items = JSON.parse(localStorage.getItem(KEY)) || null; }
      catch(e) { items = null; }
      if(!items){ items = d.items || []; save(); }

      lastSubject = localStorage.getItem(KEY + '-last') || '';

      // 恢复上次使用的模式
      var savedMode = localStorage.getItem(KEY + '-mode');
      mode = (savedMode === 'random') ? 'random' : 'group';
      modeGroupBtn.classList.toggle('active', mode === 'group');
      modeRandomBtn.classList.toggle('active', mode === 'random');

      // 作业原图：有照片就显示
      if(PHOTO){
        var photoCard = document.getElementById('photoCard');
        var photoImg = document.getElementById('photoImg');
        var photoLink = document.getElementById('photoLink');
        photoImg.src = PHOTO;
        photoLink.href = PHOTO;
        photoCard.style.display = 'block';
      }

      render();
    })
    .catch(function(){
      ptext.textContent = '⚠️ 暂时拉不到作业数据，刷新一下试试';
    });
})();
</script>

</body>
