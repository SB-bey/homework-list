<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>作业清单 · 10月3日</title>
<style>
  :root {
    --bg: #0e1013;
    --card: #1a1e25;
    --panel: #14171d;
    --line: #272d37;
    --line-strong: #364050;
    --text: #e8ebf0;
    --muted: #8b96a6;
    --faint: #7a8596;
    --accent: #4caf7d;
    --accent-2: #6fd09a;
    --danger: #ff6b7a;
    --warn: #ffd479;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(160deg, #13161b 0%, var(--bg) 100%) fixed;
    min-height: 100vh;
    min-height: 100dvh;
    padding:
      max(16px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(32px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
    color: var(--text);
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 22px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    border: 1px solid var(--line);
    padding: clamp(16px, 4.5vw, 28px);
  }

  /* ---------- 头部 ---------- */
  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px;
  }
  .header h1 { font-size: clamp(20px, 5.5vw, 26px); font-weight: 700; letter-spacing: 1px; line-height: 1.3; }
  .date { font-size: 13px; color: var(--muted); margin-left: auto; text-align: right; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .progress-wrap { background: #2a303c; border-radius: 999px; height: 8px; margin-bottom: 8px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .3s ease; }
  .progress-text { font-size: 12px; color: var(--muted); margin-bottom: 18px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- 列表 ---------- */
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 16px;
    animation: fadeIn .25s ease;
  }
  li:last-child { border-bottom: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .check {
    width: 24px; height: 24px; flex-shrink: 0;
    border: 2px solid #465264; border-radius: 8px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .15s ease, border-color .15s ease; position: relative;
  }
  /* 放大点按区域，手机上更好点 */
  .check::after { content: ""; position: absolute; inset: -10px; }
  .check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s ease; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { opacity: 1; }

  .text { flex: 1; min-width: 0; cursor: pointer; line-height: 1.5; transition: color .15s ease; word-break: break-word; overflow-wrap: anywhere; }
  li.done .text { text-decoration: line-through; text-decoration-thickness: 2px; color: #667184; }

  li.skipped .text { opacity: .5; font-style: italic; text-decoration: line-through; text-decoration-style: dotted; text-decoration-color: #555f6e; }
  li.skipped .check { border-color: #3a4454; opacity: .5; }

  .del {
    flex-shrink: 0; width: 36px; height: 36px; border: none; background: none;
    color: #66718a; font-size: 20px; line-height: 1; cursor: pointer; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; transition: color .15s ease, background-color .15s ease;
  }

  .restore {
    flex-shrink: 0; height: 32px; padding: 0 12px;
    border: 1.5px solid #3a4454; border-radius: 9px;
    background: transparent; color: #9aa5b4; font-size: 13px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background-color .15s ease;
  }

  .group-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    margin: 18px 0 2px; padding-top: 14px;
    border-top: 1px dashed #2c3340;
  }
  .group-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .group-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  /* ---------- 推荐卡片 ---------- */
  .suggest-card {
    border: 1.5px solid var(--line-strong); border-radius: 16px;
    background: var(--panel); padding: 14px; margin-bottom: 16px;
  }
  .suggest-head { font-size: 13px; font-weight: 700; color: var(--accent-2); margin-bottom: 10px; line-height: 1.5; }
  .suggest-body {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    align-items: center;
    min-height: 30px; padding: 12px; background: var(--card);
    border: 1px dashed #3a4454; border-radius: 12px; font-size: 16px; margin-bottom: 12px;
  }
  .suggest-body > .tag,
  .suggest-body > .suggest-text,
  .suggest-body > .suggest-empty { grid-column: 1 / -1; }
  .suggest-text { line-height: 1.55; font-weight: 500; word-break: break-word; overflow-wrap: anywhere; min-width: 0; }
  .suggest-empty { color: var(--faint); font-size: 14px; line-height: 1.6; }

  .tag {
    display: inline-block; font-size: 12px; font-weight: 600; color: #fff; border-radius: 6px;
    padding: 2px 9px; margin-right: 0; justify-self: start; flex-shrink: 0;
  }

  .do-btn, .skip-btn {
    min-height: 42px; border-radius: 11px; padding: 0 14px;
    font-size: 14px; cursor: pointer; flex-shrink: 0;
    transition: opacity .2s ease, color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .do-btn { margin: 0; border: none; font-weight: 600; background: var(--accent); color: #fff; }
  .do-btn:active { opacity: .75; }
  .skip-btn { border: 1.5px solid #3a4454; background: var(--card); color: #9aa5b4; }

  .suggest-controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .mode-label { font-size: 12px; color: var(--faint); }
  .mode-btn {
    min-height: 34px;
    border: 1.5px solid #3a4454; background: var(--card); color: #9aa5b4;
    border-radius: 9px; padding: 0 14px; font-size: 13px; cursor: pointer; transition: all .15s ease;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .suggest-controls select {
    min-height: 34px;
    border: 1.5px solid #3a4454; background: var(--card); color: #dbe2ec;
    border-radius: 9px; padding: 0 10px; font-size: 13px; outline: none; max-width: 100%;
  }

  /* ---------- 作业原图 ---------- */
  .photo-card {
    border: 1.5px solid var(--line-strong); border-radius: 16px;
    background: var(--panel); padding: 12px; margin-bottom: 16px;
  }
  .photo-head { font-size: 13px; font-weight: 700; color: var(--accent-2); margin-bottom: 10px; line-height: 1.5; }
  .photo-card a { display: block; }
  .photo-card img {
    width: 100%; max-height: 70vh; object-fit: contain;
    background: var(--bg); border-radius: 10px; display: block; cursor: zoom-in;
  }

  /* ---------- 添加栏 ---------- */
  .add-row { display: flex; gap: 10px; margin-top: 18px; align-items: stretch; }
  .add-row input {
    flex: 1; min-width: 0; height: 46px; border: 1.5px solid #333b49; border-radius: 12px; padding: 0 14px;
    font-size: 16px; outline: none; background: var(--panel); color: var(--text); transition: border-color .2s ease;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row input::placeholder { color: #6b7686; }
  .add-row button {
    height: 46px; border: none; border-radius: 12px; padding: 0 22px; font-size: 15px; font-weight: 600;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; cursor: pointer;
    transition: opacity .2s ease; flex-shrink: 0;
  }
  .add-row button:active { opacity: .8; }
  .add-row select {
    border: 1.5px solid #333b49; border-radius: 12px; padding: 0 10px;
    font-size: 15px; background: var(--panel); color: var(--text); outline: none; flex-shrink: 0;
    height: 46px; max-width: 104px;
  }

  /* ---------- 底部批量操作 ---------- */
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button {
    flex: 1 1 0; min-height: 42px; border-radius: 11px; padding: 0 8px;
    border: 1.5px solid #333b49; background: var(--panel); color: #9aa5b4;
    font-size: 14px; cursor: pointer; transition: all .15s ease;
  }
  .actions button:disabled { opacity: .35; cursor: not-allowed; }
  .actions button.armed { border-color: var(--danger); color: var(--danger); background: #2c1e23; }
  .actions button:active:not(:disabled) { opacity: .75; }

  .hint { font-size: 12px; color: #8590a0; margin-top: 16px; text-align: center; line-height: 1.6; }

  /* ---------- 键盘焦点 ---------- */
  button:focus-visible, select:focus-visible, .check:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent-2); outline-offset: 2px;
  }

  /* ---------- 仅在有鼠标悬停的设备启用 hover ---------- */
  @media (hover: hover) {
    .del:hover { color: var(--danger); background: #33222a; }
    .restore:hover { color: var(--accent-2); border-color: var(--accent-2); background: #1d2a24; }
    .skip-btn:hover { color: var(--warn); border-color: var(--warn); background: #2a2418; }
    .mode-btn:not(.active):hover { border-color: #55627a; color: #c4ccd8; }
    .check:hover { border-color: var(--accent); }
    .do-btn:hover, .add-row button:hover { opacity: .9; }
    .actions button:hover:not(:disabled):not(.armed) { border-color: #55627a; color: #c4ccd8; }
  }

  /* ---------- 平板 / 电脑 ---------- */
  @media (min-width: 600px) {
    body { padding-top: max(32px, env(safe-area-inset-top)); }
    .card { max-width: 640px; }
    li { padding: 14px 8px; }
    .suggest-body { grid-template-columns: 1fr auto auto; }
    .suggest-body > .suggest-text { grid-column: 1; }
    .do-btn, .skip-btn { padding: 0 18px; }
  }
  @media (min-width: 1024px) {
    .card { max-width: 720px; }
  }

  /* ---------- 小屏手机 ---------- */
  @media (max-width: 479px) {
    .add-row { flex-wrap: wrap; }
    .add-row input { order: 1; flex: 1 1 100%; }
    .add-row select { order: 2; flex: 1 1 0; max-width: none; }
    .add-row button { order: 3; flex: 1 1 0; }
  }
  @media (max-width: 360px) {
    .card { border-radius: 18px; }
    li { gap: 10px; }
    .restore { padding: 0 9px; font-size: 12px; }
  }

  /* ---------- 减少动画 ---------- */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📋 作业清单</h1>
    <span class="date">10月3日 周六 · 国庆假期</span>
  </div>
  <div class="sub">点条目或方块即可划掉，进度自动保存</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="progress-text" id="ptext"></div>

  <div class="suggest-card">
    <div class="suggest-head" id="suggestHead">🎯 下一个建议写</div>
    <div class="suggest-body" id="suggestBody"></div>
    <div class="suggest-controls">
      <span class="mode-label">模式</span>
      <button class="mode-btn active" id="modeGroup" type="button">同科优先</button>
      <button class="mode-btn" id="modeRandom" type="button">随机</button>
      <span class="mode-label" style="margin-left:4px">指定科目</span>
      <select id="pickSubject" aria-label="指定科目"><option value="">自动</option></select>
    </div>
  </div>

  <div class="photo-card" id="photoCard" style="display:none">
    <div class="photo-head">📷 作业原图 · 看不清点开看大图</div>
    <a id="photoLink" href="#" target="_blank" rel="noopener">
      <img id="photoImg" src="" alt="作业原图">
    </a>
  </div>

  <ul id="list"></ul>

  <div class="add-row">
    <select id="newSubject" aria-label="选择科目">
      <option value="">科目</option>
      <option value="语文">语文</option>
      <option value="数学">数学</option>
      <option value="英语">英语</option>
      <option value="历史">历史</option>
      <option value="政治">政治</option>
      <option value="化学">化学</option>
      <option value="物理">物理</option>
    </select>
    <input id="newItem" type="text" placeholder="输入作业内容" maxlength="60">
    <button id="addBtn" type="button">添加</button>
  </div>

  <div class="actions">
    <button id="clearDone" type="button">清除已完成</button>
    <button id="resetAll" type="button">重置全部</button>
  </div>

  <div class="hint">推荐不喜欢？点「跳过它」换一个，跳过的条目可以「恢复」</div>
</div>

<script>
(function(){
  var KEY = '';
  var PHOTO = '';   // 当天作业原图，没有照片就留空 ''
  var COLORS = { '历史': '#9a7bd6', '化学': '#4aa3a3', '语文': '#c2579a', '英语': '#3fa86b', '政治': '#d0566e', '数学': '#4a7bd6', '物理': '#e08a3c' };
  var SUBJECT_ORDER = ['语文','数学','英语','历史','政治','化学','物理'];
  var items = [];
  var mode = 'group';    // 'group' 同科优先 | 'random' 随机
  var pick = '';         // '' 自动 | 科目名
  var lastSubject = '';  // 记住正在写的科目

  var list          = document.getElementById('list');
  var input         = document.getElementById('newItem');
  var bar           = document.getElementById('bar');
  var ptext         = document.getElementById('ptext');
  var suggestBody   = document.getElementById('suggestBody');
  var suggestHead   = document.getElementById('suggestHead');
  var pickSubject   = document.getElementById('pickSubject');
  var clearDoneBtn  = document.getElementById('clearDone');
  var resetAllBtn   = document.getElementById('resetAll');
  var modeGroupBtn  = document.getElementById('modeGroup');
  var modeRandomBtn = document.getElementById('modeRandom');

  function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }
  function buzz(ms){ if(navigator.vibrate){ try { navigator.vibrate(ms); } catch(e){} } }

  /* ---------------- 推荐逻辑 ---------------- */

  function pickableSubjects(){
    var subs = [];
    items.forEach(function(it){
      if(!it.done && !it.skipped && it.subject && subs.indexOf(it.subject) === -1) subs.push(it.subject);
    });
    return subs;
  }

  function suggest(){
    var undone = items.filter(function(it){ return !it.done && !it.skipped; });
    suggestHead.textContent = '🎯 下一个建议写';
    suggestBody.innerHTML = '';

    if(!undone.length){
      var skipped = items.filter(function(it){ return it.skipped; });
      var empty = document.createElement('span');
      empty.className = 'suggest-empty';
      if(skipped.length){
        empty.textContent = '待做的都处理完啦，还有 ' + skipped.length + ' 项被跳过';
        suggestBody.appendChild(empty);
        var rb = document.createElement('button');
        rb.type = 'button';
        rb.className = 'do-btn';
        rb.textContent = '恢复全部跳过 (' + skipped.length + ')';
        rb.addEventListener('click', function(){
          items.forEach(function(it){ if(it.skipped) it.skipped = false; });
          save(); render();
        });
        suggestBody.appendChild(rb);
      } else {
        empty.textContent = '🎉 全部写完啦，可以休息了！';
        suggestBody.appendChild(empty);
      }
      return;
    }

    var target = null, reason = '';

    if(pick){
      var pu = undone.filter(function(it){ return it.subject === pick; });
      if(pu.length){ target = pu[0]; reason = '指定科目「' + pick + '」'; }
      else {
        suggestBody.innerHTML = '<span class="suggest-empty">「' + pick + '」已经写完啦 ✅</span>';
        return;
      }
    } else if(mode === 'group'){
      // 先接着写正在写的科目（同科集中写完），写完再换剩余最多的科目
      var lastUndone = null, lu = [];
      if(lastSubject){
        lu = undone.filter(function(it){ return it.subject === lastSubject; });
        if(lu.length) lastUndone = lu[0];
      }
      if(lastUndone){
        target = lastUndone;
        reason = '接着写「' + lastSubject + '」，还剩 ' + lu.length + ' 项';
      } else {
        var counts = {};
        undone.forEach(function(it){ if(it.subject) counts[it.subject] = (counts[it.subject]||0) + 1; });
        var keys = Object.keys(counts);
        if(keys.length){
          keys.sort(function(a,b){ return counts[b] - counts[a]; });
          target = undone.filter(function(it){ return it.subject === keys[0]; })[0];
          reason = '开始写「' + keys[0] + '」，共 ' + counts[keys[0]] + ' 项';
        } else {
          target = undone[0];
          reason = '按顺序来';
        }
      }
    } else {
      var subs = pickableSubjects();
      if(subs.length){
        var s = subs[Math.floor(Math.random()*subs.length)];
        target = undone.filter(function(it){ return it.subject === s; })[0];
        reason = '随机抽到「' + s + '」';
      } else {
        target = undone[Math.floor(Math.random()*undone.length)];
        reason = '随机挑一项';
      }
    }

    var idx = items.indexOf(target);
    suggestHead.textContent = '🎯 下一个建议写 · ' + reason;

    if(target.subject){
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = COLORS[target.subject] || '#999';
      tag.textContent = target.subject;
      suggestBody.appendChild(tag);
    }

    var txt = document.createElement('span');
    txt.className = 'suggest-text';
    txt.textContent = target.text;
    suggestBody.appendChild(txt);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'do-btn';
    btn.textContent = '完成它 ✓';
    btn.addEventListener('click', function(){
      items[idx].done = true;
      items[idx].skipped = false;
      if(target.subject){
        lastSubject = target.subject;
        localStorage.setItem(KEY + '-last', lastSubject);
      }
      buzz(15);
      save(); render();
    });
    suggestBody.appendChild(btn);

    var skbtn = document.createElement('button');
    skbtn.type = 'button';
    skbtn.className = 'skip-btn';
    skbtn.textContent = '跳过它 ⏭';
    skbtn.setAttribute('aria-label','暂时跳过这项推荐');
    skbtn.addEventListener('click', function(){
      items[idx].skipped = true;
      items[idx].done = false;
      save(); render();
    });
    suggestBody.appendChild(skbtn);
  }

  /* ---------------- 科目下拉 ---------------- */

  function refreshSubjects(){
    var subs = pickableSubjects();
    var cur = pickSubject.value;
    pickSubject.innerHTML = '';
    var opt0 = document.createElement('option');
    opt0.value = ''; opt0.textContent = '自动';
    pickSubject.appendChild(opt0);
    subs.forEach(function(s){
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      pickSubject.appendChild(o);
    });
    if(subs.indexOf(cur) !== -1) pickSubject.value = cur;
    else { pick = ''; pickSubject.value = ''; }
  }

  /* ---------------- 模式切换 ---------------- */

  function setMode(m){
    mode = m;
    pick = '';
    pickSubject.value = '';
    modeGroupBtn.classList.toggle('active', m === 'group');
    modeRandomBtn.classList.toggle('active', m === 'random');
    if(KEY) localStorage.setItem(KEY + '-mode', m);
    refreshSubjects();
    suggest();
  }

  modeGroupBtn.addEventListener('click', function(){ setMode('group'); });
  modeRandomBtn.addEventListener('click', function(){ setMode('random'); });
  pickSubject.addEventListener('change', function(){
    pick = pickSubject.value;
    if(pick) setMode('group') , (pick = pickSubject.value) , (pickSubject.value = pick);
    suggest();
  });

  /* ---------------- 渲染 ---------------- */

  function buildItem(item){
    var li = document.createElement('li');
    if(item.done) li.className = 'done';
    else if(item.skipped) li.className = 'skipped';

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('role','checkbox');
    check.setAttribute('tabindex','0');
    check.setAttribute('aria-checked', item.done ? 'true' : 'false');
    check.setAttribute('aria-label','完成');
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>';
    check.addEventListener('click', function(){ toggleDone(item); });
    check.addEventListener('keydown', function(e){
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggleDone(item); }
    });

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text;
    text.addEventListener('click', function(){ toggleDone(item); });

    li.appendChild(check);
    li.appendChild(text);

    if(item.skipped){
      var rs = document.createElement('button');
      rs.type = 'button';
      rs.className = 'restore';
      rs.textContent = '恢复';
      rs.setAttribute('aria-label','恢复这项作业');
      rs.addEventListener('click', function(){
        item.skipped = false;
        save(); render();
      });
      li.appendChild(rs);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.innerHTML = '×';
    del.setAttribute('aria-label','删除');
    del.addEventListener('click', function(){
      var i = items.indexOf(item);
      if(i === -1) return;
      items.splice(i, 1);
      save(); render();
    });
    li.appendChild(del);

    return li;
  }

  function render(){
    list.innerHTML = '';
    var done = 0, skipped = 0;

    // 按科目分组：同科作业聚在一起，顺序固定 语数英史政化+物理，最后"其他"
    var groups = {};
    items.forEach(function(item){
      var s = item.subject || '其他';
      if(!groups[s]) groups[s] = [];
      groups[s].push(item);
      if(item.done) done++;
      if(item.skipped) skipped++;
    });

    function renderGroup(sub){
      var arr = groups[sub];
      if(!arr || !arr.length) return;
      arr = arr.slice().sort(function(a,b){ return (a.skipped?1:0) - (b.skipped?1:0); });

      var title = document.createElement('div');
      title.className = 'group-title';
      var dot = document.createElement('span');
      dot.className = 'group-dot';
      dot.style.background = COLORS[sub] || '#6b7686';
      title.appendChild(dot);
      title.appendChild(document.createTextNode(sub));
      list.appendChild(title);

      arr.forEach(function(item){ list.appendChild(buildItem(item)); });
    }

    SUBJECT_ORDER.forEach(renderGroup);
    renderGroup('其他');

    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    bar.style.width = pct + '%';

    if(!items.length){
      ptext.textContent = '还没有作业，下面添加一条吧';
    } else {
      ptext.textContent = '已完成 ' + done + ' / ' + items.length + ' 项'
        + (skipped ? ' · 跳过 ' + skipped : '');
    }

    clearDoneBtn.disabled = !done;
    resetAllBtn.disabled = !items.length;

    refreshSubjects();
    suggest();
  }

  /* ---------------- 交互 ---------------- */

  function toggleDone(item){
    var i = items.indexOf(item);
    if(i === -1) return;
    items[i].done = !items[i].done;
    if(items[i].done){
      items[i].skipped = false;
      if(items[i].subject){
        lastSubject = items[i].subject;
        localStorage.setItem(KEY + '-last', lastSubject);
      }
      buzz(15);
    }
    save(); render();
  }

  function add(){
    var v = input.value.trim();
    if(!v) return;
    var subject = document.getElementById('newSubject').value || '';
    items.push({ text: v, subject: subject, done: false, skipped: false });
    input.value = '';
    document.getElementById('newSubject').value = '';
    save(); render();
    input.focus();
  }

  document.getElementById('addBtn').addEventListener('click', add);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') add(); });

  /* ---------------- 批量操作（两步确认） ---------------- */

  function twoStep(btn, fn){
    var orig = btn.textContent, armed = false, timer = null;
    function disarm(){
      armed = false;
      btn.textContent = orig;
      btn.classList.remove('armed');
      clearTimeout(timer);
    }
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      if(armed){ disarm(); fn(); return; }
      armed = true;
      btn.textContent = '再点一次确认';
      btn.classList.add('armed');
      timer = setTimeout(disarm, 3000);
    });
  }

  twoStep(clearDoneBtn, function(){
    items = items.filter(function(it){ return !it.done; });
    save(); render();
  });

  twoStep(resetAllBtn, function(){
    items.forEach(function(it){ it.done = false; it.skipped = false; });
    save(); render();
  });

  /* ---------------- 数据加载 ---------------- */

  fetch('data/latest.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      KEY = d.key || 'hw-list';
      PHOTO = d.photo || '';
      document.querySelector('.date').textContent = d.label || '';

      try { items = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { items = null; }
      if(!items){
        items = d.items || [];
        save();
      }

      lastSubject = localStorage.getItem(KEY + '-last') || '';

      // 恢复上次使用的模式
      var savedMode = localStorage.getItem(KEY + '-mode');
      mode = (savedMode === 'random') ? 'random' : 'group';
      modeGroupBtn.classList.toggle('active', mode === 'group');
      modeRandomBtn.classList.toggle('active', mode === 'random');

      // 作业原图：有照片就显示
      if(PHOTO){
        var photoCard = document.getElementById('photoCard');
        var photoImg  = document.getElementById('photoImg');
        var photoLink = document.getElementById('photoLink');
        photoImg.src = PHOTO;
        photoLink.href = PHOTO;
        photoCard.style.display = 'block';
      }

      render();
    })
    .catch(function(){
      ptext.textContent = '⚠️ 暂时拉不到作业数据，刷新一下试试';
    });
})();
</script>
</body>
</html>
